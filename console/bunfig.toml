[test]
# Bun's default per-test deadline is 5s, and several React suites spend most of
# a test inside `userEvent.type` — one awaited macrotask per keystroke, through
# happy-dom, through React's controlled-input round trip. On an unloaded machine
# `AuthSettingsStep.test.tsx` finishes those in well under a second; on a machine
# also running a Rust build they cross 5s and the suite reds with `timed out`
# rather than with a failed expectation.
#
# This raises the DEADLINE and nothing else: no assertion is relaxed, no test is
# skipped, and a test that genuinely hangs still fails — 20s just fails it for
# the right reason. Verified before changing it: the same suite that reported 9
# `timed out` failures under load reported `38 pass, 0 fail` at a longer
# deadline, and every one of the affected tests was one that types into five
# form fields first.
timeout = 20000

# Order matters and each entry runs to completion before the next starts.
#
#   native-globals    captures Bun's real `fetch` before happy-dom replaces it.
#                     Must be before dom-register, or the capture is happy-dom's
#                     own implementation, which silently drops Bun's per-request
#                     `tls` option and breaks the TLS fixtures.
#   server-only-shim  neutralises the `server-only` marker package, whose
#                     `default` export condition is a bare `throw`. Must be
#                     before any test file imports a credential-carrying module.
#   dom-register      installs happy-dom globals.
#   dom-setup         wires testing-library onto those globals.
preload = [
  "./tests/support/native-globals.ts",
  "./tests/support/server-only-shim.ts",
  "./tests/support/dom-register.ts",
  "./tests/support/dom-setup.ts",
]
