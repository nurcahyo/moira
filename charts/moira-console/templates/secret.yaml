{{- if .Values.secret.create }}
# Only rendered when secret.create=true, which means the values file holds
# credential material in plaintext. Default is false: the Secret named by
# secret.name is expected to exist already, created out-of-band (sealed-secrets,
# External Secrets, a cloud secret store, or by hand for a test namespace).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "moira-console.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
