{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "moira-console.labels" . | nindent 4 }}
# Belt and braces with the pod spec's own `automountServiceAccountToken: false`.
# The console never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
