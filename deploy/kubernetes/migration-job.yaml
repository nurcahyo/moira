apiVersion: batch/v1
kind: Job
metadata:
  name: moira-migrate
  labels:
    app.kubernetes.io/name: moira
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moira-migrate
    spec:
      serviceAccountName: moira
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ghcr.io/example/moira:latest
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: moira-config
            - secretRef:
                name: moira-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
