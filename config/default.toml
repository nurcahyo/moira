[deployment]
environment = "development"

[server]
host = "127.0.0.1"
port = 8080

[database]
url = ""
max_connections = 10
min_connections = 1
connect_timeout_seconds = 5
require = false
migrate_on_startup = true

[secrets]
master_key_base64 = ""
key_id = "dev-local"
allow_insecure_dev_key = true

# Envelope encryption at rest for the content columns (docs/decision-encryption-at-rest.md).
#
# A separate block from [secrets] on purpose. Provider credentials and user content have
# different retention and different blast radius, [secrets] cannot express a key *list*, and
# there is deliberately NO implicit fallback from `keys` to `secrets.master_key_base64` — a
# configuration that looks set and is inert is the failure this whole subsystem exists to refuse.
#
# **In production this block is required unconditionally**, even where no application stores
# encrypted content today, because the persistence policy is flippable at runtime through the
# admin API without a restart. Startup fails until MOIRA_CONTENT_ENCRYPTION__KEYS is set.
[content_encryption]
# Where the master key lives. "environment" is the only variant this build serves; "kms" and
# "vault" are deliberately absent rather than present-and-unimplemented, so setting one is a
# startup refusal naming what is accepted.
custody = "environment"
# "id:base64,id:base64". Neither ',' nor ':' is in the base64 alphabet, so the split is
# unambiguous. Every key an existing row might have been sealed under stays listed here through
# a rotation — that is what makes already-wrapped data keys readable with no re-encryption.
# Empty here, and supplied by MOIRA_CONTENT_ENCRYPTION__KEYS; key material never lives in a
# committed file.
keys = ""
# The id new data keys are wrapped under. Must be one of the ids in `keys`.
active_key_id = "dev-local"
# Development only. With `keys` empty this substitutes the built-in 32-byte sentinel, and
# registers as `insecure_content_encryption_key` in the unsafe-development-features startup WARN.
# Production start-up refuses to come up while this is true. Pasting the sentinel into `keys`
# is refused in *every* environment: it is reachable only through this flag, never by typing it.
allow_insecure_dev_key = true
# How often the keyring is re-read, and the floor under that interval. `Settings::validate`
# enforces the floor — an unenforced floor is an inert setting.
refresh_seconds = 300
min_refresh_seconds = 5
# Age past which the active data key is reported as overdue for rotation.
data_key_rotation_days = 30

[auth.admin]
enabled = false
jwks_url = ""
issuer = ""
audience = ""
required_scope = "moira.admin"
leeway_seconds = 60

[auth.caller]
enabled = false
jwks_url = ""
issuer = ""
audience = ""
leeway_seconds = 60
dev_trust_headers = true

[api_keys]
pepper_base64 = ""
pepper_version = "dev-local"
allow_insecure_dev_pepper = true
# Characters of the *plaintext* key kept as the indexed lookup prefix, namespace included.
# The namespace eats the first 10-11 (`moira_sys_`, `moira_cons_`, `moira_inv_`), so 20
# leaves 9-10 random base64url characters. Lowering it shortens the random part, and the
# random part is what keeps prefixes from colliding on the unique index over live keys and
# what bounds the anonymous invite preview's "no Argon2 work without a valid prefix" claim.
# `Settings::validate` refuses anything below `MIN_API_KEY_PREFIX_LENGTH` at startup rather
# than clamping it; see `src/security/api_keys.rs`.
prefix_length = 20

# Concurrent Argon2id operations (verify on every authenticated request, hash on every key mint).
# This is a MEMORY budget as much as a concurrency one: one operation holds a 19 MiB arena
# resident, so the peak is this number x 19 MiB against `resources.limits.memory` in
# `charts/moira/values.yaml` — 2Gi as shipped. Commented out, which means "derive it": one permit
# per core, clamped to [1, 8]. Rust reads the cgroup CPU quota, so the chart's `limits.cpu: "2"`
# derives 2 permits and a 38 MiB peak, 1.9% of the limit.
#
# Argon2id at p=1 is single-threaded per call, so raising this above the core count buys ZERO
# throughput and costs 19 MiB and queueing latency per extra permit. Raise `resources.limits.cpu`
# and this together, or leave it derived. `Settings::validate` refuses 0 and anything above 64.
# verification_concurrency = 2

# How long a request waits for one of those permits before being refused with a
# `503 auth_verification_overloaded`. Not zero: instant shedding at a bound of 2 would refuse a
# well-behaved caller's two-request burst. Not the route timeout either, which is never below
# 30 s — a thirty-second wait for a credential check is a different outage, not a fix. 250 ms is
# roughly five service times at a bound of 2, so a burst absorbs and a real overload is refused
# in a quarter of a second. See `src/security/api_keys.rs`.
verification_queue_timeout_ms = 250

[provider_security]
allow_private_provider_urls = false
allow_http_provider_urls = false
# ToS risk-acceptance opt-in for the chatgpt_oauth provider (issue #216). Off by default in
# every environment, including production; see ProviderSecuritySettings::allow_chatgpt_subscription.
allow_chatgpt_subscription = false

[cors]
allowed_origins = ["*"]

[docs]
expose_admin = false

[cache]
runtime_config_ttl_seconds = 10

[runtime]
diagnostic_endpoint_enabled = false
maximum_eligible_model_candidates = 20
maximum_provider_fallback_candidates = 5
maximum_retries_per_candidate = 2
maximum_total_upstream_attempts = 6
default_execution_timeout_seconds = 120
maximum_execution_timeout_seconds = 600
global_execution_concurrency = 100
application_execution_concurrency = 100
external_user_execution_concurrency = 5
runtime_cache_max_entries = 1000
runtime_cache_ttl_seconds = 300
internal_stream_queue_capacity = 64

[public_api]
openai_responses_compat_enabled = false
chat_completions_compat_enabled = false
default_persistence_mode = "metadata_only"
maximum_request_bytes = 1048576
maximum_input_items = 128
maximum_messages = 128
maximum_content_parts_per_message = 32
maximum_text_part_bytes = 262144
maximum_image_count = 8
maximum_tool_count = 32
maximum_metadata_bytes = 16384
maximum_metadata_keys = 64
maximum_metadata_depth = 4
maximum_metadata_key_bytes = 128
maximum_metadata_string_bytes = 2048
maximum_schema_bytes = 65536
heartbeat_seconds = 15
rate_limiter_max_entries = 10000

# SSRF policy for caller-supplied image URLs. Moira validates these but does not fetch
# them: the provider performs the request, so this section governs which addresses a
# caller may point the provider at, not what may come back.
[public_api.image_urls]
dns_timeout_ms = 1000
total_validation_timeout_ms = 3000
# Exact hostnames. Empty means "any host that passes the address-range rules". Setting it
# is the only control that still binds if the provider follows a redirect Moira never sees.
allowed_hosts = []
# Dev only. Production start-up refuses to come up while this is true.
allow_insecure_dev_urls = false

[redis]
enabled = false
url = ""
namespace = "moira"
connect_timeout_seconds = 2
invalidation_channel = "moira:runtime-config"

[workers]
enabled = false
shutdown_grace_seconds = 30
max_concurrent_jobs = 8
retry_base_delay_seconds = 5
retry_max_delay_seconds = 300
dead_letter_retention_hours = 168

[telemetry]
service_name = "moira"
env_filter = "moira=info,tower_http=info"
json = false
prometheus_enabled = false
metrics_path = "/metrics"
otel_enabled = false
otel_endpoint = ""

# How an agent profile's enabled `skill_refs` are executed as rig tools (issue #84,
# plan 12 §5). A skill target is a third-party HTTP endpoint an operator imported, so
# every value here bounds a call into someone else's infrastructure.
[skill_execution]
# Total model calls one tool-bearing execution may make. A tool call plus a final answer
# needs at least 2.
maximum_tool_turns = 4
maximum_advertised_tools = 32
maximum_response_bytes = 65536
dns_timeout_ms = 5000
# Dev only. Production start-up refuses to come up while this is true. Import never
# honours it — only the execution-time SSRF re-check.
allow_insecure_dev_urls = false

# The moira-runner control endpoint (issue #275, workstream R2 of #272).
#
# moira-runner is the ONLY component that talks to the Docker Engine API, which is
# root-equivalent on its host. Moira never holds Docker access; it calls this endpoint
# server-to-server instead. Deployment topology, not runtime configuration — which is why it
# lives here rather than in a table the admin API can rewrite.
#
# What a runner mints is a Claude SUBSCRIPTION credential, not an API key, and Anthropic's terms
# treat subscription auth as being for ordinary individual use of Claude Code and the other
# native Claude apps — developers building products or services are directed to API-key auth.
# Running the official CLI in a container changes the mechanism, not the purpose. There is no
# opt-in gate for this yet, unlike provider_security.allow_chatgpt_subscription above; see
# docs/claude-subscription-boundary.md and issue #307.
[claude_runner]
# Off by default: a deployment with no runner service is the normal case. While false the whole
# /api/v1/admin/runners surface answers 503 runner_service_disabled before any network call.
enabled = false
# Scheme, host and port only; the client appends /v1/runners…. The contract's default bind is
# loopback, and production start-up refuses a non-loopback http:// address.
base_url = "http://127.0.0.1:8090"
# Bearer token presented on every runner call. Never logged, never returned, never in an error.
# Empty here and supplied by MOIRA_CLAUDE_RUNNER__AUTH_TOKEN; token material never lives in a
# committed file. Start-up refuses an enabled runner with no token.
auth_token = ""
# Total budget for one runner call — applied as both request and connect timeout on the
# purpose-built client, so a call site that forgets its own timeout still cannot hang.
request_timeout_ms = 10000
