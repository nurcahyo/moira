[package]
name = "moira"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
# Moira is a deployed service, not a library, so it must never be `cargo publish`-able.
# This also satisfies `[licenses.private] ignore = true` in `deny.toml`: that setting only
# suppresses `error[unlicensed]` for workspace members actually marked unpublishable, so
# without this line `cargo deny check` fails on a crate that has no `license` field by design.
publish = false

[features]
default = []
# Adds two undocumented probe routes to the router so `tests/http_middleware_contract.rs`
# can exercise `CatchPanicLayer` and the 504 envelope mapper over a real socket. An
# integration test links the library built **without** `cfg(test)`, so a `#[cfg(test)]`
# route is invisible to it; a feature gate is the only cfg that works here.
#
# Being off by default is NOT sufficient to keep the probes out of a shipped binary:
# `--all-features` is a different feature set, and this repo's own CI uses it. Verified
# before the guard below existed: `cargo build --release --all-features --bin moira`
# produced a binary containing "/internal/test/panic", "/internal/test/slow" and the
# probe's panic message. `src/http/mod.rs` therefore raises a `compile_error!` on
# `all(feature = "test-routes", not(debug_assertions))`, so an optimized build carrying
# this feature fails to compile instead of shipping an unauthenticated panic-on-demand
# route. `cargo clippy --all-features` and `cargo test --all-features` are unaffected —
# both build with `debug_assertions` on.
test-routes = []

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
# Docker Engine API client, used by the SECOND binary only (`src/bin/moira-runner.rs`).
# The `moira` binary must never reach the Docker socket — socket access is root-equivalent
# on the host — so every call into this crate is confined to `src/runner/docker_engine.rs`
# behind the `ContainerEngine` trait, and a unit test in `src/runner/mod.rs` pins that the
# `bollard` import appears in exactly one file.
#
# Default features are `["http", "pipe"]` and both are load-bearing: `pipe` supplies the
# unix-socket and named-pipe transports (`/var/run/docker.sock`, the normal case) and
# `http` supplies the TCP transport that `DOCKER_HOST=tcp://…` selects. `connect_with_defaults`
# dispatches on `DOCKER_HOST` at runtime, so dropping either feature turns a working
# operator configuration into a startup failure.
bollard = "0.21"
chrono = { version = "0.4", features = ["clock", "serde"] }
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
futures-util = "0.3"
hmac = "0.12"
jsonwebtoken = "9"
metrics = "0.24"
# `default-features = false` is a SECURITY requirement, not a size preference. The default
# feature set is `["http-listener", "push-gateway"]`: `http-listener` starts an independent
# HTTP server that exposes the whole metric registry on its own port, bypassing both
# `settings.telemetry.prometheus_enabled` and the `/metrics` route contract; `push-gateway`
# ships metrics outbound on a timer. Moira serves `/metrics` itself through Axum and needs
# only the recorder plus `PrometheusHandle::render()`, both in the feature-free core.
metrics-exporter-prometheus = { version = "0.17", default-features = false }
opentelemetry = "0.32"
# OTLP over HTTP/protobuf, deliberately NOT gRPC. `grpc-tonic` would pull tonic 0.14 +
# tonic-prost + tonic-types into a tree that contains no tonic today; `http-proto` reuses the
# `reqwest` 0.13 client Moira already depends on and adds only `prost` + `opentelemetry-proto`
# (`gen-tonic-messages = ["prost"]` — no tonic). `reqwest-rustls` resolves to
# `reqwest/default-tls`, which in reqwest 0.13 is `rustls` — matching Moira's rustls-only posture.
#
# `reqwest-blocking-client`, NOT `reqwest-client`, and this is load-bearing: the non-experimental
# `opentelemetry_sdk::trace::BatchSpanProcessor` drains its queue on a dedicated OS thread using
# `futures_executor::block_on`, which carries no Tokio reactor. The async reqwest backend then
# panics there with "there is no reactor running, must be called from the context of a Tokio 1.x
# runtime" on the first export. Verified empirically, not inferred. The blocking backend runs its
# own internal runtime on its own thread and exports cleanly; it is also upstream's own default.
# The async backend would additionally require `opentelemetry_sdk`'s
# `experimental_trace_batch_span_processor_with_async_runtime` + `rt-tokio` features.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "internal-logs", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["internal-logs", "trace"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "script"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rig-core = "0.40"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["chrono", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
# Already in the tree transitively (aes-gcm, argon2, jsonwebtoken); made direct because
# `src/runner/token.rs` compares the runner control token with `ConstantTimeEq` and a
# transitive version is not a version this crate may rely on. Same reasoning as `zeroize`
# below. BSD-3-Clause, already on `deny.toml`'s allow-list for exactly this crate.
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "timeout", "trace", "util"] }
tracing = "0.1"
# `default-features = false` drops the optional `metrics` feature, which would add
# `tracing_opentelemetry::MetricsLayer` — a second, OTel-side metrics pipeline. Moira's metrics
# surface is Prometheus via `src/infra/metrics.rs` only. `tracing-log` is kept so `log`-crate
# records from dependencies still reach the OTel bridge.
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
# Already in the tree transitively (aes-gcm, secrecy); made direct because
# `src/security/key_custody.rs` holds master-key material as `Zeroizing<[u8; 32]>` and a
# transitive version is not a version this crate may rely on.
zeroize = "1"

[dev-dependencies]
# `test-utils` is a dependency-free rig-core feature (`rig-core-0.40.0/Cargo.toml:75`) that
# exposes `rig_core::test_utils` — `MockCompletionModel`/`MockTurn` and the scripted HTTP
# doubles `RecordingHttpClient`/`MockStreamingClient`/`SequencedStreamingHttpClient`/
# `HttpErrorStreamingClient`. Used to prove Rig's own request encoder/response decoder without a
# socket (`.agents/skills/moira-rig-errors-testing/SKILL.md`, "L2" testing strategy) — first
# exercised here for the `chatgpt_oauth` provider (issue #216), which needed a network-free way
# to prove the `ChatGPTAuth::AccessToken` construction path is real and reachable without ever
# touching `chatgpt.com`.
rig-core = { version = "0.40", features = ["test-utils"] }

# Build-time profile tuning. Not about the shipped artifact — `--release` is untouched — but about
# how long the edit/check/test loop takes and how much disk it costs.
#
# The measured problem: `target/` reached 131 GB during plan 06 and sat at 20 GB routinely, of which
# `debug/deps` was 11 GB and `debug/incremental` 8.5 GB. That forced `cargo clean`, which discards
# all 405 compiled dependencies and buys a multi-minute rebuild to reclaim space that was mostly
# cache. Shrinking the artifacts is what breaks that cycle; reclaiming harder does not.
[profile.dev]
# Line tables instead of full DWARF. Panics still carry file and line — which is all the test suite
# and the backtraces in CI actually use — but the per-object debuginfo that dominates `deps/` goes
# away, and linking gets materially cheaper. That matters disproportionately here because 27 test
# binaries each link the whole crate.
#
# Raise this to 2 if you need to step through a debugger; it is a one-line, one-rebuild change.
debug = 1

[profile.test]
debug = 1

# `[profile.dev.package."*"] opt-level = 3` is still declined — optimising all 405 dependencies
# costs more rebuild time than it returns. But the "this suite is Postgres-I/O-bound, not CPU-bound"
# claim this comment used to make was wrong for the heaviest targets: they are dominated by Argon2id.
# `ApiKeyHasher::verify` (src/security/api_keys.rs:211) is `Argon2::default()` — m=19456 KiB, t=2 —
# and runs per authenticated request with no memoisation, compiled at opt-level 0.
#
# MEASURED (2026-08-14), and only this. 8-core Apple M2, Postgres in Docker Desktop, test binaries
# invoked DIRECTLY so cargo is out of the loop, one dedicated CARGO_TARGET_DIR, arms interleaved
# A/B/A/B, test source byte-identical between arms. The metric is libtest's own
# "test result: … finished in Ns" line. Median of the 4 cleanest samples per arm, with the range:
#
#   secret_leak_snapshots   18.30s [17.90-18.69]  ->  2.75s [2.70-2.77]   6.6x   ranges disjoint
#   content_leak_snapshots   9.39s [ 9.24- 9.68]  ->  2.01s [1.95-2.02]   4.7x   ranges disjoint
#
# Honest caveat: another agent's test suite loaded this machine during collection. Over ALL 50
# samples the secret ranges stay disjoint, but the content ranges DO overlap (worst AFTER 9.35s vs
# best BEFORE 9.24s) — every AFTER sample above 6s was taken at 1-3% CPU idle. Contention can only
# inflate a runtime, so the k-fastest estimator above is applied identically to both arms. The
# pairing is the stronger evidence: in all 25 back-to-back pairs the AFTER member was faster.
#
# NOT MEASURED: every other target, and the effect on `ubuntu-latest`. Other authenticating targets
# should benefit, but no number here claims it, and a slower CI core plus a relatively larger
# fixture floor do not compose predictably. `ci/test-costs.tsv` is therefore left CI-sourced and
# knowingly stale for these two rows rather than patched with local values.
#
# The rebuild objection does not apply at this scope: `cargo tree -i blake2` shows blake2 is reached
# only through argon2, so this invalidates 3 units (blake2, argon2, moira), not 405 — a one-off
# 1m39s, not repaid on ordinary edits. Cargo.lock is unchanged.
#
# `--release` is untouched, so the shipped artifact is byte-identical. Argon2id is deterministic:
# `opt-level` changes how fast a hash is computed, never what it computes, so no assertion anywhere
# became easier to pass. If anything this raises test fidelity, because production has always run
# these crates optimised. The `[profile.test.*]` pair below is belt-and-braces: cargo builds a test
# target's dependencies with the dev profile, so those two blocks are expected to be inert. They are
# set to the same value, so they cannot cause a second compile of either crate.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
