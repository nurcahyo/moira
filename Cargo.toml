[package]
name = "moira"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[features]
default = []
# Adds two undocumented probe routes to the router so `tests/http_middleware_contract.rs`
# can exercise `CatchPanicLayer` and the 504 envelope mapper over a real socket. An
# integration test links the library built **without** `cfg(test)`, so a `#[cfg(test)]`
# route is invisible to it; a feature gate is the only cfg that works here.
#
# Being off by default is NOT sufficient to keep the probes out of a shipped binary:
# `--all-features` is a different feature set, and this repo's own CI uses it. Verified
# before the guard below existed: `cargo build --release --all-features --bin moira`
# produced a binary containing "/internal/test/panic", "/internal/test/slow" and the
# probe's panic message. `src/http/mod.rs` therefore raises a `compile_error!` on
# `all(feature = "test-routes", not(debug_assertions))`, so an optimized build carrying
# this feature fails to compile instead of shipping an unauthenticated panic-on-demand
# route. `cargo clippy --all-features` and `cargo test --all-features` are unaffected —
# both build with `debug_assertions` on.
test-routes = []

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
futures-util = "0.3"
hmac = "0.12"
jsonwebtoken = "9"
opentelemetry = "0.32"
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rig-core = "0.40"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["chrono", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "timeout", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
