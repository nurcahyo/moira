services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: moira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moira"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - moira-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - moira-redis:/data

volumes:
  moira-postgres:
  moira-redis:
