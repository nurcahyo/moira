services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: moira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moira"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - moira-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - moira-redis:/data

  # Local OIDC IdP for exercising the console's sign-in path with no external
  # account (Google, GitHub, ...). Gated behind the `dev-idp` profile so
  # `docker compose up -d --wait` (what `make up` runs) does NOT start it — see
  # `scripts/keycloak-dev.sh` / `make keycloak` and docs/local-testing.md.
  #
  # LOCAL DEVELOPMENT ONLY. The realm import (`deploy/keycloak/realm-moira.json`)
  # carries a published client secret and two non-temporary passwords by design —
  # see that file's client `description`. The TLS cert mounted below is
  # self-signed and generated by `scripts/keycloak-dev.sh`, never committed.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["dev-idp"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/tls.key
    ports:
      - "8081:8080"
      - "8443:8443"
    volumes:
      - ./deploy/keycloak/realm-moira.json:/opt/keycloak/data/import/realm-moira.json:ro
      - ./deploy/keycloak/tls.crt:/opt/keycloak/certs/tls.crt:ro
      - ./deploy/keycloak/tls.key:/opt/keycloak/certs/tls.key:ro

  # Manual test/dev entry for the pinned image built by
  # scripts/build-claude-runner-image.sh (deploy/claude-runner/Dockerfile) —
  # issue #272, see docs/claude-runners.md. This is NOT how a runner gets
  # provisioned in production: that is the moira-runner service's job, and it
  # creates containers itself over the Docker Engine API per the frozen
  # runner control contract, one per provisioned instance, never through this
  # compose entry. This service exists so an operator can sanity-check the
  # pinned image by hand — start it, `docker compose logs -f claude-runner`
  # for the authorization URL, attach to paste a code — before trusting
  # moira-runner to do the unattended equivalent. The `HostConfig` shape below
  # (no binds, dropped capabilities, no new privileges) mirrors what the
  # control contract requires moira-runner to set on every container it
  # creates, so a manual run here exercises the same constraints.
  #
  # LOCAL DEVELOPMENT / MANUAL VERIFICATION ONLY. Gated behind the
  # `claude-runner` profile for the same reason `dev-idp` is: `docker compose
  # up -d --wait` (what `make up` runs) must not start it by accident. Start
  # and stop it exactly like `keycloak` above — name the service, and never
  # use a bare `compose down`, which would also tear down this repo's
  # postgres/redis default-profile services:
  #
  #   docker compose --profile claude-runner up -d claude-runner
  #   docker compose --profile claude-runner rm --stop --force --volumes claude-runner
  claude-runner:
    image: moira-claude-runner:local
    profiles: ["claude-runner"]
    tty: true
    stdin_open: true
    command: ["claude", "setup-token"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128

volumes:
  moira-postgres:
  moira-redis:
