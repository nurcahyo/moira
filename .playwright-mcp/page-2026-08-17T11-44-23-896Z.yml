                  - /url: https://pages.ebay.com/managed-shipping-sellers/
                  - text: eBay Shipping Terms and Conditions
                  - generic: "- opens in new window or tab"
                - text: for more details.
              - heading "15. Payment Services" [level=2]
              - paragraph [ref=e334]:
                - text: Payments for goods and services sold using our Services are facilitated by designated eBay entities (each, an "eBay Payment Entity") pursuant to the
                - link "Payments Terms of Use - opens in new window or tab" [ref=e335] [cursor=pointer]:
