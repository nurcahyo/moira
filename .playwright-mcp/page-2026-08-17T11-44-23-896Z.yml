              - paragraph [ref=e159]:
                - strong [ref=e160]:
                  - text: Read this User Agreement carefully as it contains provisions that govern how claims you and we have against each other are resolved (see "Disclaimer of Warranties; Limitation of Liability" and "Legal Disputes" provisions below). It also contains an Agreement to Arbitrate which will, with limited exception, require you to submit claims you have against us or related third parties to binding and final arbitration, unless you opt out of the Agreement to Arbitrate in accordance with section 19.B.9 (see
                  - link "Legal Disputes, Section B" [ref=e161] [cursor=pointer]:
                    - /url: "#B. Agreement"
                  - text: "(\"Agreement to Arbitrate\")). If you do not opt out: (1) you will only be permitted to pursue claims against us or related third parties on an individual basis, not as a plaintiff or class member in any class or representative action or proceeding; (2) you will only be permitted to seek relief (including monetary, injunctive, and declaratory relief) on an individual basis; and (3) you are waiving your right to pursue disputes or claims and seek relief in a court of law and to have a jury trial."
              - heading "2. About eBay" [level=2]
              - paragraph [ref=e162]: eBay is a marketplace that allows users to offer, sell, and buy goods and services in various geographic locations using a variety of pricing formats. eBay is not a party to contracts for sale between third-party sellers and buyers, nor is eBay a traditional auctioneer.
              - paragraph [ref=e163]: "Any guidance eBay provides as part of our Services, such as pricing, shipping, listing, and sourcing is solely informational and you may decide to follow it or not. We may use artificial intelligence or AI-powered tools and products to provide and improve our Services, to offer you a customized and personalized experience, to provide you with enhanced customer service, and to support fraud detection; availability and accuracy of these tools are not guaranteed. We may help facilitate the resolution of disputes between buyers and sellers through various programs. Unless otherwise expressly provided, eBay has no control over and does not guarantee: the existence, quality, safety, or legality of items advertised; the truth or accuracy of users' content or listings; the ability of sellers to sell items; the ability of buyers to pay for items; or that a buyer or seller will actually complete a transaction or return an item."
              - heading "3. Using eBay" [level=2]
