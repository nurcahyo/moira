              - paragraph [ref=e193]: If we believe you are violating this User Agreement or any of our policies, or abusing eBay and/or our Services in any way, we may, in our sole discretion and without limiting other remedies, limit, suspend, or terminate your user account(s) and access to our Services, delay or remove hosted content, remove any special status associated with your account(s), remove, not display, and/or demote listings, reduce or eliminate any discounts, and take technical and/or legal steps to prevent you from using our Services. We may offer a process allowing users to report claimed violations for us to consider and handle through one or more of these options, all in our sole discretion.
              - paragraph [ref=e194]:
                - text: If we believe you are violating our policies prohibiting
