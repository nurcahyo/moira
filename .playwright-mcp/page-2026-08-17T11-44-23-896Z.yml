                - listitem [ref=e167]: use our Services if you are not able to form legally binding contracts (for example, if you are under 18 years old), or are temporarily or indefinitely suspended from using our Services, or are a person with whom transactions are prohibited under economic or trade sanctions;
                - listitem [ref=e168]:
                  - text: fail to pay for items purchased by you, unless you have a valid reason as set out in an eBay policy, for example, where the seller has materially changed the item's description after you bid (see our
                  - link "Unpaid item policy" [ref=e169] [cursor=pointer]:
                    - /url: /help/policies/payment-policies/unpaid-item-policy?id=4271
                  - text: );
                - listitem [ref=e170]: fail to deliver items sold by you, unless you have a valid reason as set out in an eBay policy;
                - listitem [ref=e171]: manipulate the price of any item or interfere with any other user's listings;
                - listitem [ref=e172]: fail to complete delivery, clear ownership, and/or complete any other documentation associated with the sale or purchase of any vehicle;
                - listitem [ref=e173]:
                  - text: take any action that may undermine the feedback or ratings systems (our
                  - link "Feedback policies" [ref=e174] [cursor=pointer]:
                    - /url: /help/policies/feedback-policies/feedback-policies?id=4208
                  - text: );
                - listitem [ref=e175]: transfer your eBay account (including feedback) and user ID to another party without our consent;
                - listitem [ref=e176]:
