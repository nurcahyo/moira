                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: .
              - heading "13. Authorization to Contact You; Recording Calls; Analyzing Message Content" [level=2]
              - paragraph [ref=e273]:
                - text: "eBay may contact you using autodialed or prerecorded calls and text messages, at any telephone number, and by email to any email address that you have provided us, to: (i) notify you regarding your account; (ii) troubleshoot problems with your account; (iii) resolve a dispute; (iv) collect a debt; (v) poll your opinions through surveys or questionnaires; or (vi) as otherwise necessary to service your account or enforce this User Agreement, our policies, applicable law, or any other agreement we may have with you. eBay may also contact you using autodialed or prerecorded calls and text messages for marketing purposes (e.g., offers and promotions), if you consent to such communications. Our collection, use, disclosure, retention, and protection of your personal information is governed by our"
                - link "User Privacy Notice" [ref=e274] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/user-privacy-notice?id=4260
                - text: . As described in our
                - link "User Privacy Notice" [ref=e275] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/user-privacy-notice?id=4260
                - text: ", eBay may collect other telephone numbers for you and may place manual non-marketing calls to any of those numbers and autodialed non-marketing calls to any landline. Standard telephone minute and text charges may apply and may include overage fees if you have exceeded your plan limits. You may change your marketing communications preference for calls at any time, including through the"
                - link "Communication Preferences - opens in new window or tab" [ref=e276] [cursor=pointer]:
                  - /url: https://commspreferences.ebay.com/commsprefs
                  - text: Communication Preferences
                  - generic: "- opens in new window or tab"
                - text: section of your
                - link "My eBay - opens in new window or tab" [ref=e277] [cursor=pointer]:
                  - /url: https://www.ebay.com/myb/Summary
                  - text: My eBay
                  - generic: "- opens in new window or tab"
                - text: . You may also opt out of a specific text marketing campaign by replying "STOP" to such marketing text message.
              - paragraph [ref=e278]:
                - text: eBay may share your telephone number with its authorized service providers as stated in our
                - link "User Privacy Notice" [ref=e279] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/user-privacy-notice?id=4260
                - text: . These service providers may contact you using autodialed or prerecorded calls and text messages, only as authorized by eBay to carry out the purposes identified above.
              - paragraph [ref=e280]: eBay may, without further notice or warning and in its discretion, monitor or record telephone conversations you or anyone acting on your behalf has with eBay or its agents for quality control and training purposes, or for its own protection.
              - paragraph [ref=e281]: "eBay's automated systems may scan and analyze the contents of every message sent through its messaging platforms (including but not limited to chat and email channels), including messages between users, to: (i) detect and prevent fraudulent activity or violations of eBay's User Agreement, including the incorporated terms, notices, rules, and policies and (ii) provide and improve our Services. This may result in a manual review of messages sent through our messaging tools. This scanning and analysis may occur before, during, or after the message is sent, or while in storage, and may result in your message being delayed or withheld. eBay may store message contents, including to conduct this scanning and analysis."
              - heading "Privacy of Others; Marketing" [level=3] [ref=e282]
              - paragraph [ref=e283]: If eBay provides you with information about another user, you agree you will use the information only for the purposes that it is provided to you. You may not disclose or distribute a user's information to a third party for purposes unrelated to our Services. Additionally, you may only send marketing communications to users who have consented to receive them in accordance with applicable laws, and only using eBay Services.
              - heading "14. Additional Terms" [level=2]
              - heading "Returns and cancellations for sellers" [level=3] [ref=e284]
              - paragraph [ref=e285]:
                - text: Sellers can create rules to automate replacements, returns, and refunds under certain circumstances. For all new sellers, in listings where returns are accepted, eBay will set a default rule that automates the return process. Sellers may remove or customize their return preferences in their account settings within My eBay. Where settings have been set to automatically accept requests for returns or replacements, an eBay-generated return shipping label will be provided to your buyer. You agree to comply with our
                - link "returns policy" [ref=e286] [cursor=pointer]:
                  - /url: /help/selling/managing-returns-refunds/managing-returns-refunds?id=4079
                - text: .
              - paragraph [ref=e287]: When an item is returned or if a transaction is canceled after payment has been completed, eBay may issue a refund to the buyer on the seller's behalf and charge the seller for the amount of the refund.
              - paragraph [ref=e288]: "Additionally, eBay may charge sellers for the cost of return shipping labels and/or other reasonable fees from sellers when:"
              - list [ref=e289]:
                - listitem [ref=e290]: An eBay-generated return shipping label is used, and the seller is responsible for its cost;
                - listitem [ref=e291]: Returns have been automated;
                - listitem [ref=e292]: The seller fails to send the buyer a return shipping label and, instead, an eBay-generated shipping label is used; and/or
                - listitem [ref=e293]: The item is not as described in the listing and is returned in accordance with eBay Money Back Guarantee or other applicable terms.
              - paragraph [ref=e294]:
                - text: eBay or eBay Payment Entities may invoice sellers for these charges and collect such charges as described in the
                - link "Payments Terms of Use - opens in new window or tab" [ref=e295] [cursor=pointer]:
                  - /url: https://pages.ebay.com/payment/2.0/terms.html
                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: .
              - paragraph [ref=e296]:
                - text: All seller cancellations of orders must be in accordance with our
                - link "Order cancellation policy" [ref=e297] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/order-cancellation-policy?id=5298
                - text: .
              - heading "Returns and cancellations for buyers" [level=3] [ref=e298]
              - paragraph [ref=e299]:
                - text: Buyers generally do not have the right to cancel an order. Buyers can request to cancel an order on eBay within the time period and as provided in our
                - link "Order cancellation policy" [ref=e300] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/order-cancellation-policy?id=5298
                - text: ", and the seller will have 3 days to accept or decline the request. If the order cannot be canceled, buyers may still be permitted to return the item if the item is"
                - link "eligible for return" [ref=e301] [cursor=pointer]:
                  - /url: /help/policies/ebay-money-back-guarantee-policy/ebay-money-back-guarantee-policy?id=4210
                - text: .
              - paragraph [ref=e302]: In certain instances, a buyer may be responsible for the cost of return shipping for an item returned to a seller. If the buyer is responsible for the return shipping costs, the buyer may elect to use an eBay-generated shipping label or purchase a shipping label directly from a carrier. By choosing to use an eBay-generated shipping label, you (as a buyer) agree that eBay may deduct the cost of the shipping label from the refund owed to you.
              - heading "eBay Money Back Guarantee" [level=3] [ref=e303]
              - paragraph [ref=e304]:
                - text: Most eBay sales go smoothly, but if there's a problem with a purchase covered by
                - link "eBay Money Back Guarantee" [ref=e305] [cursor=pointer]:
                  - /url: /help/policies/ebay-money-back-guarantee-policy/ebay-money-back-guarantee-policy?id=4210
                - text: ", buyers can get their money back if an item didn't arrive, is faulty or damaged, or doesn't match the listing. You agree to comply with the policy and permit us to make a final decision on any eBay Money Back Guarantee case."
              - paragraph [ref=e306]:
                - text: If you (as seller) choose to reimburse a buyer, or are required to reimburse a buyer or eBay under the eBay Money Back Guarantee, eBay or eBay Payments Entities may invoice you in the amount of the reimbursement, or collect the amount of the reimbursement from you as described in the
                - link "Payments Terms of Use - opens in new window or tab" [ref=e307] [cursor=pointer]:
                  - /url: https://pages.ebay.com/payment/2.0/terms.html
                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: . If we cannot get reimbursement from you, we may collect the outstanding sums using other collection mechanisms, including retaining collection agencies.
              - paragraph [ref=e308]:
                - text: We may suspend the
                - link "eBay Money Back Guarantee" [ref=e309] [cursor=pointer]:
                  - /url: /help/policies/ebay-money-back-guarantee-policy/ebay-money-back-guarantee-policy?id=4210
                - text: in whole or in part without notice if we suspect abuse or interference with the proper working of the policy. You agree to make us whole for any losses, including expenses we incur to recoup such losses, arising out of your abuse of the eBay Money Back Guarantee, or any fraud you commit in connection with the eBay Money Back Guarantee.
              - heading "Recommendations" [level=3] [ref=e310]
              - paragraph [ref=e311]: eBay may offer personalized recommendations to you to provide a relevant and engaging experience, helping you sell or buy items of interest to you. These recommendations may consider data related to your eBay activity, the item, and seasonality, among other factors.
              - heading "eBay Live" [level=3] [ref=e312]
              - paragraph [ref=e313]:
                - text: eBay Live is an interactive live streaming feature of our Services that allows sellers to host live events where buyers can view, interact with, and purchase items in real time. When you access or use eBay Live as a seller or buyer, you must comply with the
                - link "eBay Live policy" [ref=e314] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/ebay-live-policy?id=5478
                - text: and all other rules and policies that apply to your use of our Services, including the
                - link "eBay rules and policies" [ref=e315] [cursor=pointer]:
                  - /url: /help/policies/default/ebay-rules-policies?id=4205
                - text: ", each as updated from time to time. These policies are incorporated into this User Agreement by reference."
              - paragraph [ref=e316]:
                - text: Participation in eBay Live as a seller is available to sellers who meet our eligibility criteria and remain in compliance with this User Agreement, the
                - link "eBay Live policy" [ref=e317] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/ebay-live-policy?id=5478
                - text: ", seller agreements, and our policies. The primary purpose of each seller's eBay Live stream must be to promote and sell items listed through that eBay account."
              - paragraph [ref=e318]:
                - text: As an eBay Live seller, you are responsible for the acts and omissions of any personnel and guests who appear in your live streams, including their compliance with this User Agreement, the
                - link "eBay Live policy" [ref=e319] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/ebay-live-policy?id=5478
                - text: ", seller agreements, and our policies. We may, at any time and in our sole discretion, suspend or terminate access to eBay Live, or require the immediate removal of any individual from an eBay Live stream, if we believe they have violated this User Agreement, seller agreements, or any of our policies."
              - heading "Shipping" [level=3] [ref=e320]
              - paragraph [ref=e321]:
                - text: eBay may add certain delivery options to your listings to help improve both the seller and the buyer experience for selecting a delivery label. For listings that are eligible, you may see a simplified listing flow where eBay will require you to (i) list with eBay shipping as the delivery method and (ii) ship your item using the shipping label eBay provided to you. In such instances, your buyer may be able to choose whether to have a standard or express delivery service, or whether to collect at one of the carrier's locations. Once your item has sold, the delivery costs paid by your buyer at checkout will be paid to eBay for the shipping label provided to you. If you have chosen to offer free delivery, you agree that the delivery costs owed to eBay will be deducted from your account and paid to eBay as set forth in eBay's
                - link "Payments Terms of Use - opens in new window or tab" [ref=e322] [cursor=pointer]:
                  - /url: https://pages.ebay.com/payment/2.0/terms.html#article-8
                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: . You agree that no further delivery costs are owed to you by your buyer for the shipping label provided to you.
              - paragraph [ref=e323]: As a buyer, you agree that any delivery costs you pay at checkout for the shipping label will be owed to eBay.
              - paragraph [ref=e324]:
                - text: By listing with eBay shipping services, you are acknowledging that you have read and agreed to the
                - link "eBay Shipping Terms and Conditions - opens in new window or tab" [ref=e325] [cursor=pointer]:
                  - /url: https://pages.ebay.com/managed-shipping-sellers/
                  - text: eBay Shipping Terms and Conditions
                  - generic: "- opens in new window or tab"
                - text: "and that they will apply to you as a seller and to all of your eligible new and existing listings. These terms include, among other important provisions:"
              - list [ref=e326]:
                - listitem [ref=e327]:
                  - text: an acknowledgment that you agree and are responsible for ensuring that your listings and items are compliant with the
                  - link "eBay Shipping Terms and Conditions - opens in new window or tab" [ref=e328] [cursor=pointer]:
                    - /url: https://pages.ebay.com/managed-shipping-sellers/
                    - text: eBay Shipping Terms and Conditions
                    - generic: "- opens in new window or tab"
                  - text: including any applicable carrier terms; and
                - listitem [ref=e329]: a description of the items that are ineligible for the delivery services and restrictions on the value, weights, and dimensions of items that may qualify for eBay shipping as a delivery option.
              - paragraph [ref=e330]:
                - text: You also acknowledge and agree that should the buyer request a return, you may be responsible for refunding the buyer any outbound delivery costs (including for express delivery) for the label eBay provided to you, and that the outbound delivery costs will be deducted from your account to execute the refund. If you declare the size and weight of your item at listing, you will be responsible for ensuring you declare this correctly. If you have under-declared the size or weight of your item and additional delivery costs are due to eBay, the additional delivery costs (including any applicable administration or other fees) will be deducted from your account and paid to eBay as set forth in eBay's
                - link "Payments Terms of Use - opens in new window or tab" [ref=e331] [cursor=pointer]:
                  - /url: https://pages.ebay.com/payment/2.0/terms.html#article-8
                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: .
