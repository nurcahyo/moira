                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: to the extent applicable to you. To receive payment for an item sold using our Services, you must accept and comply with the
                - link "Payments Terms of Use - opens in new window or tab" [ref=e337] [cursor=pointer]:
                  - /url: https://pages.ebay.com/payment/2.0/terms.html
                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: ", including the requirements to provide to eBay Payment Entities information about you, your business, and the financial account you will use to receive payments."
              - paragraph [ref=e338]: "If you are a buyer:"
              - list [ref=e339]:
                - listitem [ref=e340]: You may pay for items and services using the payment methods that the eBay Payment Entities make available, and the eBay Payment Entities will manage settlement of the payment to sellers. The eBay Payment Entities will collect the transaction amount on behalf of the seller by charging your selected payment method. Accordingly, payments received by the eBay Payment Entity from you will satisfy your obligations to pay the seller in the amount of payments received;
                - listitem [ref=e341]: In certain instances, your transaction may be declined, frozen, or held for any reason including for suspected fraud, Anti-Money Laundering ("AML") compliance, compliance with economic or trade sanctions, in connection with eBay's internal risk controls or due to potential violations of any policy of eBay or the eBay Payment Entity, or a policy of one of the Payment Entity's third-party payment services providers;
                - listitem [ref=e342]: eBay, the eBay Payment Entity or its affiliates may save payment information, such as credit card or debit card numbers, and card expiration dates, entered by you on our Services when you make a purchase, redeem a coupon, or make any other transaction on our Services where card information is entered. Such stored payment information may be used as your default payment method for future transactions on our Services. At any time, you can update your card information or enter new card information, at which point the new card information shall be stored as your default payment method. You may make changes to your default payment method through the payment section in My eBay. You are responsible for maintaining the accuracy of information we have on file, and you consent to eBay updating such stored information from time to time based on information provided by you, your bank or other payments services providers. You will only provide information about payment methods that you are authorized to use. By placing a payment method on file with us, you authorize eBay Payment Entities to charge your payment method(s) for any and all amounts arising from your use of our Services, including charges to recover the proceeds of any fraud perpetrated by you, or charges necessary to recoup amounts refunded to you in error;
                - listitem [ref=e343]:
                  - text: You may seek
                  - link "returns or cancellations" [ref=e344] [cursor=pointer]:
                    - /url: "#Returns"
                  - text: on our Services, or file
                  - link "eBay Money Back Guarantee" [ref=e345] [cursor=pointer]:
                    - /url: "#eBay"
                  - text: claims on our Services. If you are entitled to a refund, the eBay Payment Entities will issue the refund if the eBay Payment Entities processed the original payment. Refund timing may vary in accordance with the rules of third parties, such as credit and debit card networks;
                - listitem [ref=e346]: You agree to comply with, and not cause a third party to violate, all applicable laws, regulations, rules and terms and conditions in connection with the use of the services provided by the eBay Payment Entities. You understand that some third parties, such as credit and debit card issuers, credit and debit card networks and payments services providers, may have their own terms and conditions for the payment or settlement methods you choose to use in connection with managed payments transactions. Failure to abide by third-party terms and conditions may result in fees assessed to you (for example, currency conversion fees from your credit card issuer if the transaction currency is different from your credit card currency) or other actions taken by such third parties, and you agree that the eBay Payment Entity has no control over, or responsibility or liability for, such fees or actions.
