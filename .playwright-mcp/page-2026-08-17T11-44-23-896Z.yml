              - paragraph [ref=e197]: We may cancel unconfirmed accounts or accounts that have been inactive for a substantial period of time. Additionally, we reserve the right to refuse, modify, or terminate all or part of our Services to anyone for any reason at our discretion.
              - heading "4. Vehicle Purchases & Sales" [level=2]
              - paragraph [ref=e198]:
                - text: As it relates to vehicle listings, the online purchase and sale of vehicles is powered by and made possible by the services of Caramel Dealer Services, LLC. As such, when you purchase or sell a vehicle listed on eBay sites and the buyer elects title and registration services, you are contracting with Caramel Dealer Services, LLC d/b/a CDS Auto Sales ("Caramel"). Caramel is an eBay affiliate that holds state licenses as a used vehicle dealer in Arizona, California, Florida, Texas, and Washington. Caramel's
                - link "Terms of Use - opens in new window or tab" [ref=e199] [cursor=pointer]:
                  - /url: https://www.drivecaramel.com/legal/terms-of-use
                  - text: Terms of Use
                  - generic: "- opens in new window or tab"
                - text: ","
                - link "Privacy Policy - opens in new window or tab" [ref=e200] [cursor=pointer]:
                  - /url: https://www.drivecaramel.com/legal/privacy-policy
                  - text: Privacy Policy
                  - generic: "- opens in new window or tab"
                - text: ", and additional policies and terms posted on and in its sites, applications, tools, and services set forth the terms under which you may access and use Caramel Services."
              - paragraph [ref=e201]: "eBay is not a vehicle broker, vehicle dealer, or an agent acting on behalf of vehicle brokers, dealers, buyers or sellers. eBay does not maintain an inventory of vehicles for sale and does not sell, exchange, buy, offer for sale, negotiate or attempt to negotiate sales or exchanges of an interest in any vehicle listed on eBay sites. eBay has never: (1) held title for any vehicle listed on eBay sites; (2) inspected any vehicle listed on eBay sites; (3) set or negotiated prices for any vehicle listed on eBay sites; (4) had any vehicle listed on eBay sites in its possession; (5) shipped, distributed, or delivered any vehicle listed on eBay sites; or (6) sold a vehicle listed on eBay sites by consignment."
              - paragraph [ref=e202]: "IN ADDITION TO, AND WITHOUT LIMITING THE GENERALITY OF THE DISCLAIMERS OF WARRANTIES DETAILED IN SECTION 16, YOU AGREE THAT: (A) EBAY DOES NOT WARRANT AGAINST DEFECTS IN ANY VEHICLE, AND DOES NOT MAKE ANY WARRANTY OF ANY KIND, EITHER EXPRESS OR IMPLIED, INCLUDING REPRESENTATIONS, PROMISES, OR STATEMENTS AS TO THE VEHICLE’S VALUE, CONDITION, SAFETY, CAPABILITY, FITNESS, OR MERCHANTABILITY, (B) NO INFORMATION OBTAINED ON EBAY SITES WILL CREATE ANY WARRANTY, EXPRESS OR IMPLIED, (C) YOU HAVE NOT AND WILL NOT RELY UPON ANY REPRESENTATION AS TO THE VEHICLE’S VALUE, CONDITION, SAFETY, CAPABILITY, FITNESS, OR MERCHANTABILITY, AS COMING FROM EBAY, AND (D) EBAY MAKES NO WARRANTY CONCERNING ANY VEHICLE’S TITLE. EBAY DISCLAIMS ALL VEHICLE-RELATED REPRESENTATIONS, GUARANTEES, AND WARRANTIES TO THE FULLEST EXTENT PERMISSIBLE BY LAW."
              - paragraph [ref=e203]: You agree that any reliance on vehicle information on eBay sites is at your own risk. Any discrepancies or mistakes made regarding vehicle availability, quality, safety, condition, pricing, financing, insurance and the like are not the fault or responsibility of eBay. Neither the accuracy of vehicle information provided on eBay.com, nor the availability, quality, or safety of vehicles is guaranteed by eBay. Furthermore, neither the financing of or insurance relevant to vehicles is controlled or guaranteed by eBay.
              - paragraph [ref=e204]: The purchase of a vehicle encompasses multiple disciplines and eBay is not an expert on matters such as vehicle market valuation, laws relating to vehicles, taxes relating to vehicles, vehicle financing, vehicle registration, vehicle insurance, vehicle condition safety, and inspections, or vehicle mechanical fitness and engineering, eBay hereby cautions you, and you understand and acknowledge, that you should seek professional expert assistance and advice in these and other areas of professional expertise as appropriate.
              - heading "5. Policy Enforcement" [level=2]
              - paragraph [ref=e205]: When a buyer or seller issue arises, we may consider the user's performance history and the specific circumstances in applying our policies. We may choose to be more lenient with policy enforcement in an effort to do the right thing for both buyers and sellers. The foregoing does not limit or impair our right to refuse, modify, or terminate all or part of our Services to anyone, or to terminate this agreement with anyone, for any reason at our discretion.
              - heading "6. Fees and Taxes" [level=2]
              - paragraph [ref=e206]: We charge sellers for the use of our Services. In some cases, where buyers receive supplemental Services such as authentication or storage Services for items in certain categories, we may also charge those buyers for such supplemental Services.
              - paragraph [ref=e207]:
                - text: The fees we charge sellers for using our Services to sell goods and services are listed on our
                - link "Selling fees" [ref=e208] [cursor=pointer]:
                  - /url: /help/selling/fees-credits-invoices/selling-fees?id=4822
                - text: pages. We may change our selling fees from time to time by posting the changes on the eBay site fourteen (14) days in advance, but with no advance notice required for temporary promotions or any changes that result in the reduction of fees.
              - paragraph [ref=e209]:
                - text: If you are a seller, you are liable for fees arising out of all sales made using some or all of our Services, even if sales terms are finalized or payment is made outside of eBay. In particular, if you offer or reference your contact information or ask a buyer for their contact information in the context of
                - link "buying or selling outside of eBay" [ref=e210] [cursor=pointer]:
                  - /url: /help/policies/payment-policies/offers-buy-sell-outside-ebay-policy?id=4272
                - text: ", you may be liable to pay a"
                - link "final value fee" [ref=e211] [cursor=pointer]:
                  - /url: /help/selling/fees-credits-invoices/selling-fees?id=4822#section2
                - text: applicable to that item, even if the item doesn't sell, given your usage of our Services for the introduction to a buyer.
              - paragraph [ref=e212]:
                - text: You as a seller must have a payment method on file when using our selling Services and pay all fees and applicable taxes associated with your use of our Services by the payment due date. If your payment method fails or your account is past due, we may place restrictions on your account, or the eBay Payments Entities (as defined below) may collect amounts owed in the manner described in the
                - link "Payments Terms of Use - opens in new window or tab" [ref=e213] [cursor=pointer]:
                  - /url: https://pages.ebay.com/payment/2.0/terms.html
                  - text: Payments Terms of Use
                  - generic: "- opens in new window or tab"
                - text: ", and"
                - link "late fees will apply" [ref=e214] [cursor=pointer]:
                  - /url: /help/selling/fees-credits-invoices/setting-changing-payment-method?id=4124#requirements
                - text: . eBay, or the collection agencies we retain, may also report information about your account to credit bureaus, and as a result, late payments, missed payments, or other defaults on your account may be reflected in your credit report. If you wish to dispute the information eBay reported to a credit bureau (i.e., Experian, Equifax, or TransUnion) please contact us at eBay Inc., c/o Global Collections, 7700 West Parmer Lane, Building D, Austin, TX 78729. If you wish to dispute the information a collection agency reported to a credit bureau regarding your eBay account, you must contact the collection agency directly.
              - heading "7. Listing Conditions" [level=2]
              - paragraph [ref=e215]:
                - text: When listing an item for sale on our Services, you agree to comply with eBay's
                - link "Listing policies" [ref=e216] [cursor=pointer]:
                  - /url: /help/policies/listing-policies/listing-policies?id=4213
                - text: and
                - link "Selling practices policy" [ref=e217] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/selling-practices-policy?id=4346
                - text: "and also agree that:"
              - list [ref=e218]:
                - listitem [ref=e219]: You assume full responsibility for the item offered and the accuracy and content of the listing, including listing content created using tools offered by eBay or third parties such as translation, image editing, and generative artificial intelligence tools;
                - listitem [ref=e220]: Your listing may not be immediately searchable by keyword or category for several hours (or up to 24 hours in some circumstances). eBay can't guarantee exact listing duration;
                - listitem [ref=e221]: Your fixed-price listings may renew automatically every calendar month, based on the listing terms at the time, until all quantities sell or the listing is ended by you or eBay, in its sole discretion;
                - listitem [ref=e222]:
                  - text: The content you provide complies with all of our listing policies, including the
                  - link "Images, videos and text policy" [ref=e223] [cursor=pointer]:
                    - /url: /help/policies/listing-policies/images-text-policy?id=4240
                  - text: ;
                - listitem [ref=e224]: Content that violates any of eBay's policies may be modified, obfuscated, or deleted at eBay's sole discretion;
                - listitem [ref=e225]: We may revise listings to supplement, remove, or correct information;
                - listitem [ref=e226]:
                  - text: "We strive to create a marketplace where buyers find what they are looking for. Therefore, the appearance or placement of listings in search and browse results will depend on a variety of factors, including, but not limited to:"
                  - list [ref=e227]:
                    - listitem [ref=e228]: buyer's location, search query, browsing site, and history;
                    - listitem [ref=e229]: item's location, listing format, price and shipping cost, terms of service, end time, history, and relevance to the user query;
                    - listitem [ref=e230]:
                      - text: seller's history, including listing practices,
                      - link "Detailed Seller Ratings" [ref=e231] [cursor=pointer]:
                        - /url: /help/buying/resolving-issues-sellers/seller-ratings?id=4023#section2
                      - text: ", eBay policy compliance, feedback, and defect rate; and"
                    - listitem [ref=e232]: number of listings matching the buyer's query.
                - listitem [ref=e233]: To drive a positive user experience, a listing may not appear in some search and browse results regardless of the sort order chosen by the buyer;
                - listitem [ref=e234]: Some advanced listing upgrades will only be visible on some of our Services;
                - listitem [ref=e235]:
                  - text: eBay's
                  - link "Duplicate listings policy" [ref=e236] [cursor=pointer]:
                    - /url: /help/policies/listing-policies/duplicate-listings-policy?id=4255
                  - text: may also affect whether your listing appears in search results;
                - listitem [ref=e237]: Metatags and URL links that are included in a listing may be removed or altered;
                - listitem [ref=e238]: We may provide you with optional information to consider when creating your listings. Such information may be based on the aggregated sales and performance history of similar sold and/or current listings; results may vary for individual listings;
                - listitem [ref=e239]: You agree that we may display the sales and performance history of your individual listings (and their associated campaigns) to others;
                - listitem [ref=e240]:
                  - text: For items listed in certain categories, subject to certain programs, and/or offered or sold at certain price points, eBay may require the use of certain payment methods, subject to our
                  - link "Payments methods policy" [ref=e241] [cursor=pointer]:
                    - /url: /help/policies/payment-policies/accepted-payments-policy?id=4269
                  - text: . For example, for inventory covered by authentication or storage services, buyer and sellers may be subject to escrow and/or payment handling requirements;
                - listitem [ref=e242]: You will not sell and will promptly remove all listings for any product recalled by a manufacturer or governmental agency if the sale of the product is prohibited by law or regulation or if the product poses a health or safety hazard as specified by any governmental agency. eBay has no responsibility or liability for the safety or performance of any product that you list or sell using our Services, including any product that is subject to a recall. You are solely responsible for any non-conformity or defect in, or compliance with any public or private recall of, any product you list or sell using our Services;
                - listitem [ref=e243]: eBay may publish and promote your listings, including related content such as username, product reviews and feedback, in any format and through any channel, including across any eBay Services, our partners, or third-party property or advertising medium; and
                - listitem [ref=e244]: Selling fees do not purchase exclusive rights to item exposure on our Services. We may display third-party advertisements (including links and references thereto) or other content in any part of our Services, including listings, in our sole discretion and without consent from, or payment, fee reduction, or other credit to, sellers.
              - heading "8. Purchase Conditions" [level=2]
              - paragraph [ref=e245]:
                - text: When buying an item using our Services, you agree to the
                - link "Rules and policies for buyers" [ref=e246] [cursor=pointer]:
                  - /url: /help/policies/rules-policies-buyers/rules-policies-buyers?id=4206
                - text: "and that:"
              - list [ref=e247]:
                - listitem [ref=e248]: You are responsible for reading the full item listing before making a bid or offer, buying, or committing to buy;
                - listitem [ref=e249]: You enter into a legally binding contract to purchase an item when you buy the item, commit to buy the item, your offer for the item is accepted, you have the winning bid for the item, or your bid for the item is otherwise accepted, regardless of when payment is due or received unless the transaction terms state that you are required to pay for the item before a binding contract is formed;
                - listitem [ref=e250]: For motor vehicles and real estate, a bid or offer initiates a non-binding transaction representing a buyer's serious expression of interest in buying the seller's item and does not create a formal contract between the buyer and the seller;
                - listitem [ref=e251]: We do not transfer legal ownership of items from the seller to you;
                - listitem [ref=e252]: Utah Code Annotated § 70A-2-401(2) and Uniform Commercial Code § 2-401(2) apply to the transfer of ownership between the buyer and the seller, unless the buyer and the seller agree otherwise.
              - heading "9. International Buying and Selling; Translation" [level=2]
              - paragraph [ref=e253]:
                - text: Given the nature of eBay's global marketplace, listings may be viewed and purchased by, and shipped to, buyers around the world. Many of our Services are accessible internationally. We offer certain programs, tools, and experiences of particular interest to international sellers and buyers, such as estimated local currency conversion and international shipping calculation tools. If, as a seller, you do not want your item to be sold to buyers internationally, you can exclude countries or regions you don't want to ship to by adjusting your shipping settings as provided in the
                - link "International selling policy" [ref=e254] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/international-selling-policy?id=4689
                - text: . Sellers and buyers are responsible for complying with all laws and regulations applicable to the international sale, purchase, and shipment of items.
              - paragraph [ref=e255]:
                - text: If you purchase an item on an eBay site that is different from your registration site, you are subject to the User Agreement and applicable policies of that other eBay site with respect to that particular purchase, as detailed in the
                - link "International selling policy" [ref=e256] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/international-selling-policy?id=4689
                - text: .
              - paragraph [ref=e257]:
                - text: For sellers, you agree that we may display your listing for sale on an eBay site other than the site where you listed your item for sale, based on your shipping settings. You may adjust these settings as detailed in the
                - link "International selling policy" [ref=e258] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/international-selling-policy?id=4689
                - text: . If you list your items with an international shipping option, the appearance of your listings on sites other than the listing site is not guaranteed. If you sell an item on an eBay site that is different from your registration or listing site, you are subject to the User Agreement and applicable policies, including any buyer protection programs, of that other eBay site with respect to that particular sale, as detailed in the
                - link "International selling policy" [ref=e259] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/international-selling-policy?id=4689
                - text: .
              - paragraph [ref=e260]: You authorize us to use automated tools to translate your eBay content, including member-to-member communications, in whole or in part, into local languages where such translation solutions are available. We may provide you with tools which will enable you to translate content at your request. The accuracy and availability of any translation are not guaranteed.
              - paragraph [ref=e261]:
                - text: One of the ways we make eBay.com listings available to international buyers is through the eBay International Shipping Program ("EIS"). EIS enables buyers to obtain parcel processing, international shipping, and customs clearance services. It is facilitated by eBay through third-party service providers that eBay has contracted with to operationalize the program. By listing your item on eBay.com you agree to the
                - link "EIS Terms and Conditions - opens in new window or tab" [ref=e262] [cursor=pointer]:
                  - /url: https://pages.ebay.com/internationalshippingprogram/seller/terms/
                  - text: EIS Terms and Conditions
                  - generic: "- opens in new window or tab"
                - text: . If you choose not to participate in EIS, you can opt out of the program by updating your
                - link "shipping preferences" [ref=e263] [cursor=pointer]:
                  - /url: /help/selling/shipping-items/setting-shipping-options/ebay-international-shipping-program?id=5348#section9
                - text: .
              - heading "10. Content" [level=2]
              - paragraph [ref=e264]: When you provide content using our Services (directly or indirectly), you grant us a non-exclusive, worldwide, perpetual, irrevocable, royalty-free, sublicensable (through multiple tiers) right to exercise any and all Intellectual Property Rights you have in that content in connection with our provision, expansion, and promotion of our Services, including development of new offerings as part of our Services, in any media known now or developed in the future. To the fullest extent permitted under applicable law, you waive your right to enforce your Intellectual Property Rights, including any moral rights, in that content against eBay, our assignees, our sublicensees, and their assignees in connection with our, those assignees', and those sublicensees' use of that content in connection with our provision, expansion, and promotion of our Services.
              - paragraph [ref=e265]: You represent and warrant that, for all such content you provide, you own or otherwise control all necessary rights to do so and to meet your obligations under this User Agreement. You represent and warrant that such content is accurate, appropriate, and legal. You represent and warrant that use of any such content (including derivative works) by us, our users, or others in contract with us, and in compliance with this User Agreement, does not and will not infringe any Intellectual Property Rights of any third party. eBay takes no responsibility and assumes no liability for any content provided by you or any third party.
              - paragraph [ref=e266]: We offer product data (including images, descriptions and specifications) that are provided by third parties (including eBay users). You may use that content solely in your eBay listings. eBay may modify or revoke such permission at any time in our sole discretion. The product data includes copyrighted, trademarked, and other proprietary materials. You agree not to remove any copyright, proprietary, or identification markings in the product data and not to create any derivative works based on that data (other than by including the data in your listings).
              - paragraph [ref=e267]: We try to offer reliable product data, but we cannot promise that the content provided through our Services will always be available, accurate, complete, and up-to-date. You agree that eBay is not responsible for examining or warranting the listings or content provided by third parties through our Services, and that you will not attempt to hold us or our data providers liable for inaccuracies.
              - paragraph [ref=e268]: The name "eBay" and other eBay marks, logos, designs, and phrases that we use in connection with our Services are trademarks, service marks, or trade dress of eBay in the U.S. and other countries. They may not be used without the express written prior permission of eBay.
              - heading "11. Notice for Claims of Intellectual Property Violations and Copyright Infringement Pursuant to Section 512(c) of Title 17 of the United States Code" [level=2]
              - paragraph [ref=e269]:
                - text: We respond to notices of alleged copyright infringement under the United States Digital Millennium Copyright Act. eBay's Verified Rights Owner (VeRO) program works to ensure that items and content using our Services do not infringe upon the copyright, trademark, or certain other intellectual property rights of third parties. If you believe that your intellectual property rights have been infringed, please notify our VeRO team and we will investigate.
                - link "Learn how to submit a notice to eBay - opens in new window or tab" [ref=e270] [cursor=pointer]:
                  - /url: https://pages.ebay.com/vero/
                  - text: Learn how to submit a notice to eBay
                  - generic: "- opens in new window or tab"
                - text: .
              - heading "12. Holds and Restricted Funds" [level=2]
              - paragraph [ref=e271]:
                - text: To protect eBay from risk of liability for your actions as a seller, eBay Payments Entities (as defined below) may restrict access to your funds as described in the
                - link "Payments Terms of Use - opens in new window or tab" [ref=e272] [cursor=pointer]:
