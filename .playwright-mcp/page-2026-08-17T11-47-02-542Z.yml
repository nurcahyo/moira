                  - strong [ref=f24e518]: Please read these conditions carefully before placing an order with Amazon EU SARL. By placing an order with Amazon EU SARL, you signify your agreement to be bound by these conditions.
              - generic [ref=f24e519]:
                - heading "1. OUR CONTRACT" [level=2] [ref=f24e520]
                - paragraph [ref=f24e521]: Your order is an offer to Amazon to buy the product(s) in your order. When you place an order to purchase a product from Amazon, we will send you an e-mail confirming receipt of your order and containing the details of your order (the Order Confirmation E-mail). The Order Confirmation E-mail is acknowledgement that we have received your order, and does not confirm acceptance of your offer to buy the product(s) ordered. We only accept your offer, and conclude the contract of sale for a product ordered by you, when we dispatch the product to you and send e-mail confirmation to you that we've dispatched the product to you (the Dispatch Confirmation E-mail). If your order is dispatched in more than one package, you may receive a separate Dispatch Confirmation E-mail for each package, and each Dispatch Confirmation E-mail and corresponding dispatch will conclude a separate contract of sale between us for the product(s) specified in that Dispatch Confirmation E-mail. Your contract is with Amazon EU Sarl. Without affecting your right of cancellation set out in section 2 below, you can cancel your order for a product at no cost any time before we send the Dispatch Confirmation E-mail relating to that product. This right to cancel does not apply to certain categories of products and services, including digital products or software which are not supplied in a physical format (e.g. on a CD or DVD), once download or use (whichever is earlier) has begun.
                - paragraph [ref=f24e522]: You consent to receive sales invoices electronically. Electronic invoices will be made available in pdf format in the Your Account area of the web site. For each delivery, we will inform you in our Dispatch Confirmation E-mail if an electronic invoice is available. For further information about electronic invoices and instructions on how to receive a paper copy please refer to our help pages.
                - paragraph [ref=f24e523]: Please note that we sell products only in quantities which correspond to the typical needs of an average household. This applies both to the number of products ordered within a single order and the placing of several orders for the same product where the individual orders comprise a quantity typical for a normal household.
              - generic [ref=f24e524]:
                - heading "2. RIGHT OF CANCELLATION UP TO 14 DAYS, EXCEPTIONS TO CANCELLATION AND OUR VOLUNTARY RETURNS GUARANTEE" [level=2] [ref=f24e525]
                - paragraph [ref=f24e526]:
                  - strong [ref=f24e527]: STATUTORY RIGHT
                - paragraph [ref=f24e528]: Unless one of the exceptions listed below applies, you can cancel your order without giving any reason within 14 days from the day on which you or a third party indicated by you (other than the carrier) receives the goods purchased (or last good, lot or piece if it relates to goods or multiple lots or pieces delivered separately) or from the day of the conclusion of the contract, in the case of services or digital content not supplied in a tangible medium (e.g. CD or DVD).
                - paragraph [ref=f24e529]:
                  - text: You must inform us (Amazon EU Sarl, 38 avenue John F. Kennedy, L-1855 Luxemburg) of your decision to cancel your order. You may submit your request according to the instructions and forms available on our
                  - link "Returns Support Centre" [ref=f24e531] [cursor=pointer]:
                    - /url: https://www.amazon.co.uk/returns
                  - text: ", by"
                  - link "contacting us" [ref=f24e533] [cursor=pointer]:
                    - /url: https://www.amazon.co.uk/contactus
                  - text: ", or using this"
                  - link "Cancellation Form" [ref=f24e535] [cursor=pointer]:
                    - /url: https://www.amazon.co.uk/cancellationform
                  - text: . In case you use the return centre, we will communicate to you an acknowledgement of receipt by e-mail. To meet the cancellation deadline, it is sufficient for you to send your communication before the 14 days’ cancellation period has expired and return the item via our return centre.
                - paragraph [ref=f24e536]: For additional information on the scope, content and instructions for the exercise, please contact our Customer Service.
                - paragraph [ref=f24e537]:
                  - strong [ref=f24e538]: EFFECTS OF CANCELLATION
                - paragraph [ref=f24e539]: We will reimburse all payments received from you for the goods purchased (unless we are entitled to reduce your refund, as explained below) and will also reimburse delivery charges for the least expensive type of delivery offered by us, no later than 14 days from the day on which we received the above communication. We will use the same means of payment as you used for the initial transaction, unless you have expressly agreed otherwise. In any event, you will not incur any fees as a result of such reimbursement. We may withhold reimbursement until we have received the goods back or you have supplied evidence of having sent back the goods, whichever is the earliest. If reimbursement occurs after the maximum time period mentioned above, the amount due to you will as of right be increased.
                - paragraph [ref=f24e540]: Note that you must send back the goods by following the instructions available on our return centre no later than 14 days from the day on which you communicate your cancellation to us. You will have to bear the direct cost of returning these goods. You may be liable if the value of the goods returned diminishes due to your handling of the goods (except when it was necessary to establish the nature, characteristics and functioning of the goods). In this case, we may reduce your refund to reflect the diminished value of the goods. If the goods are significantly damaged as a result of your handling of them, you may not be entitled to a refund for them.
                - paragraph [ref=f24e541]:
                  - strong [ref=f24e542]: EXCEPTIONS TO THE RIGHT OF CANCELLATION
                - paragraph [ref=f24e543]: "The right of cancellation does not apply to:"
                - list [ref=f24e544]:
                  - listitem [ref=f24e545]: the delivery of products which are not suitable for return due to health protection or hygienic reasons if unsealed by you after delivery, or which are, after delivery, inseparably mixed with other items;
                  - listitem [ref=f24e546]: the delivery of sealed audio or video recordings or of sealed software if unsealed by you after delivery;
                  - listitem [ref=f24e547]: the supply of goods made to your specifications or clearly personalized;
                  - listitem [ref=f24e548]: the supply of goods which may deteriorate or expire rapidly;
                  - listitem [ref=f24e549]: a service if Amazon has fully performed it and you accepted when you placed your order that we could start to deliver it, and that you could not cancel it once delivery had started;
                  - listitem [ref=f24e550]: the supply of digital content (including apps, digital software, ebooks, MP3, etc) which is not supplied on a tangible medium (e.g. on a CD or DVD) if you accepted when you placed your order that we could start to deliver it, and that you could not cancel it once delivery had started;
                  - listitem [ref=f24e551]: the delivery of newspapers, journals or magazines with the exception of subscription contracts for the supply of such publications; and
                  - listitem [ref=f24e552]: the supply of alcoholic beverages whose actual value is dependent on fluctuations in the market which we cannot control.
                - paragraph [ref=f24e553]:
                  - strong [ref=f24e554]: OUR VOLUNTARY RETURNS GUARANTEE
                - paragraph [ref=f24e555]: "Without prejudice to your statutory rights, Amazon provides you with the following voluntary returns guarantee:"
                - paragraph [ref=f24e556]:
                  - text: All products from the Amazon sites can be returned within 30 days of receipt of the products to Amazon if the products are complete and are in an unused and undamaged condition. For shrink-wrapped and/or sealed data media (for example CDs, audio cassettes, VHS videos, DVDs, PC and video games and software) this means that we only take back the products in the unopened shrink wrap film or with an undamaged seal. The products are to be returned via our
                  - link "Returns Support Centre" [ref=f24e558] [cursor=pointer]:
                    - /url: https://www.amazon.co.uk/returns
                  - text: . This voluntary returns guarantee does not apply to digital products or software which are not supplied on a tangible medium (e.g. on a CD or DVD).
                - paragraph [ref=f24e559]: You must return each product in the same condition in which you received it. You may be liable if the value of any returned product has been diminished due to your handling of it (except when such handling was necessary to establish the nature, characteristics and functioning of the product). Therefore, if you do not return products in the same condition in which you received them in, Amazon reserves the right to reject the return or deduct a portion of the original purchase price from your refund to cover the diminished value.
                - paragraph [ref=f24e560]:
                  - text: If you return products according to this voluntary returns guarantee, we will refund to you the purchase price already paid by you (or a partial refund if you do not return a product in the same condition in which you received it), but not the delivery costs of your initial purchase. Likewise the transport risk and return costs might be borne by you. If you return Fashion items specific policies apply, for more details see
