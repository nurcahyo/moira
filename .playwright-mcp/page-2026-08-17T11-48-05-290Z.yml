                - text: .
              - heading "15. Additional Terms" [level=2]
              - heading "Terms of Returns for the Seller" [level=3] [ref=e323]
              - paragraph [ref=e324]:
                - text: Sellers can create rules to automate returns and refunds under certain circumstances. Also eBay may set a default rule that automates the return process for some or all listings where returns are accepted. Sellers may remove or customise their returns preferences in their account settings within My eBay. Where returns have been set to automatically accept requests, an eBay-generated return postage label will be provided to your buyer. You agree to comply with our
                - link "returns policies" [ref=e325] [cursor=pointer]:
                  - /url: /help/selling/managing-returns-refunds/managing-returns-refunds?id=4079
                - text: .
              - paragraph [ref=e326]: If the buyer returns an item because it does not match the listing description, sellers will be responsible for return postage costs.
              - paragraph [ref=e327]: "You authorise eBay to include return postage charges and auto-refunds on your seller invoice, which may be charged to your automatic payment method on file, when:"
              - list [ref=e328]:
                - listitem [ref=e329]: an eBay-generated return postage label is used, and the seller is responsible for its cost;
                - listitem [ref=e330]: returns and refunds have been automated; and/or
                - listitem [ref=e331]: you fail to send your buyer a return postage label and instead an eBay-generated label is used.
              - paragraph [ref=e332]:
                - text: See our
                - link "cancelling a transaction policy" [ref=e333] [cursor=pointer]:
                  - /url: /help/selling/getting-paid/canceling-transaction?id=4136
                - text: for details on cancellations.
              - heading "eBay Money Back Guarantee" [level=3] [ref=e334]
              - paragraph [ref=e335]:
                - text: Most eBay sales go smoothly, but if there's a problem with a purchase, the eBay Money Back Guarantee helps buyers and sellers communicate and resolve issues. The
                - link "eBay Money Back Guarantee policy" [ref=e336] [cursor=pointer]:
                  - /url: /help/policies/ebay-money-back-guarantee-policy/ebay-money-back-guarantee-policy?id=4210
                - text: is part of this User Agreement and is incorporated by reference. You agree to comply with the policy and permit us to make a final decision on any case.
              - paragraph [ref=e337]:
                - text: Under the
                - link "eBay Money Back Guarantee" [ref=e338] [cursor=pointer]:
                  - /url: /help/policies/ebay-money-back-guarantee-policy/ebay-money-back-guarantee-policy?id=4210
                - text: ", if a seller chooses or is required to reimburse the buyer or eBay because a case is resolved in the buyer's favour, we may request the eBay entity which processed the payment to reimburse the buyer on your behalf pursuant to the eBay Money Back Guarantee policy. In the event that the funds held on the seller's behalf are insufficient for refunding the buyer based on a successful eBay Money Back Guarantee claim, the seller is obliged to reimburse us for the amounts owed to the buyer. The sellers authorise us to recoup these amounts from the seller on our behalf in accordance with eBay's policies and procedures (including any amounts resulting from international transactions as stipulated in the eBay Money Back Guarantee policy)."
              - paragraph [ref=e339]: Where the seller is found at fault, we will notify the seller and charge the reimbursement amount to the seller's chosen payment method, or invoice the seller for the reimbursement amount.
              - paragraph [ref=e340]:
                - text: Sellers must have a payment method on file with eBay. Sellers may change this payment method by
                - link "contacting eBay" [ref=e341] [cursor=pointer]:
                  - /url: "#contactWay"
                - text: ". For this purpose, you, in the capacity of a seller authorise and instruct us to:"
              - list [ref=e342]:
                - listitem [ref=e343]: collect or reverse variable amounts from your account to carry out a buyer reimbursement;
                - listitem [ref=e344]: charge the payment method you select to recover the amount we pay to the buyer (in cases where we refund the buyer directly); and
                - listitem [ref=e345]: place the reimbursement amount on the seller invoice, including but not limited to the cost of return postage labels.
              - paragraph [ref=e346]: You acknowledge and agree that your authorisations above will be made on a recurring basis and on various dates as required by us to implement the terms of the eBay Money Back Guarantee policy. For future claims, where we resolve a dispute in the buyer's favour, we will notify the seller and continue to charge the seller's preferred payment method. If sellers do not provide eBay with a valid reimbursement method, we may collect the outstanding sums using other collection mechanisms, including retaining collection agencies. We may suspend the eBay Money Back Guarantee policy without notice if we suspect abuse or interference with the proper working of the policy.
              - heading "eBay Live" [level=3] [ref=e347]
              - paragraph [ref=e348]:
                - text: eBay Live is an interactive live streaming feature that allows sellers to host live events where buyers can view, interact with, and purchase items in real time. When you access or use eBay Live as a seller or buyer, you must comply with the
                - link "eBay Live policy" [ref=e349] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/ebay-live-policy?id=5478
                - text: and all other rules and policies that apply to your use of our Services, as updated from time to time.
              - paragraph [ref=e350]:
                - text: Participation in eBay Live as a seller is available to sellers who meet our eligibility criteria and remain in compliance with this User Agreement, the
                - link "eBay Live policy" [ref=e351] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/ebay-live-policy?id=5478
                - text: ", seller agreements, and our policies. The primary purpose of each seller's eBay Live stream must be to promote and sell items listed through that eBay account."
              - paragraph [ref=e352]:
                - text: As an eBay Live seller, you are responsible for the acts and omissions of any personnel and guests who appear in your live streams, including their compliance with this User Agreement, the
                - link "eBay Live policy" [ref=e353] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/ebay-live-policy?id=5478
                - text: ", seller agreements, and our policies. We may, at any time and in our sole discretion, suspend or terminate access to eBay Live, or require the immediate removal of any individual from an eBay Live stream, if we believe they have violated this User Agreement, seller agreements, or any of our policies."
              - heading "Correcting mistakes in payments to buyers and sellers" [level=3] [ref=e354]
              - paragraph [ref=e355]: We reserve the right to fix any processing errors we discover. We will correct any processing errors by debiting or crediting the payment method used for the eBay Money Back Guarantee refund or reimbursement.
              - heading "Global Shipping Programme" [level=3] [ref=e356]
              - paragraph [ref=e357]: One of the ways that we may make ebay.co.uk listings available to international buyers on ebay.co.uk and on our international sites is through the Global Shipping Programme. For items that are located in the UK and that are purchased from you by an international buyer in a country eligible for the Global Shipping Programme, you will post the item to a shipping centre located in the UK. A third-party global technology and shipping provider will oversee the processing, customs clearance and international postage of the item to your buyer. For items that are purchased by international buyers through the Global Shipping Programme, buyers will pre-pay any applicable postage and import charges during checkout and will benefit from international tracking of the item from the shipping centre to delivery.
              - paragraph [ref=e358]: We may choose to make your listings available to international buyers through the Global Shipping Programme unless you opt out of the programme at either an account, country or listing level.
              - paragraph [ref=e359]:
                - text: By not opting out of the programme, you will also be acknowledging that you have read and agreed to the
                - link "Global Shipping Programme Seller Terms and Conditions - opens in new window or tab" [ref=e360] [cursor=pointer]:
                  - /url: https://pages.ebay.co.uk/shipping/globalshipping/seller-tnc.html
                  - text: Global Shipping Programme Seller Terms and Conditions
                  - generic: "- opens in new window or tab"
                - text: "and that they will apply to you as a seller and to all of your eligible new and existing listings. These terms include, among other important provisions:"
              - list [ref=e361]:
                - listitem [ref=e362]: a third-party agreement for the parcel processing, customs clearance, and international postage and tracking services, including your consent to the disclosure of certain personal information to third parties in connection with those services;
                - listitem [ref=e363]: an authorisation for third parties to act in your place to facilitate the export clearance of items that you sell through the Global Shipping Programme;
                - listitem [ref=e364]: an acknowledgment that you agree and are responsible for ensuring that your listings and items are compliant with applicable overseas laws and regulations;
                - listitem [ref=e365]: a description of the items that are ineligible for the programme and restrictions on the value, weights and dimensions of items that may be sold through the programme;
                - listitem [ref=e366]: a list of countries that are eligible for the programme; and
                - listitem [ref=e367]: policies governing the handling of lost, damaged and undeliverable items (including their possible disposal), returns, and the resolution of eBay Money Back Guarantee claims for items that you sell through the programme.
              - heading "Simple Delivery" [level=3] [ref=e368]
              - paragraph [ref=e369]: We may add certain delivery options to your listings in order to help improve both seller and buyer experience for selecting a delivery label. For listings that are eligible, you may see a simplified listing flow where eBay will require you to list with Simple Delivery as your delivery method and post your item using the Simple Delivery label provided to you. In such instances, your buyer may be able to choose whether to have a standard or express delivery service or whether to collect in store. Once your item has sold, the delivery costs paid by your buyer at checkout will be transferred to eBay for the Simple Delivery label provided to you. If you have chosen to offer free delivery, you agree that the delivery costs owed to eBay will be deducted from your account. You agree that no further delivery costs are owed to you by your buyer for the Simple Delivery label provided to you.
              - paragraph [ref=e370]: As a buyer, you agree that any delivery costs you pay at checkout for the Simple Delivery label will be owed to eBay.
              - paragraph [ref=e371]:
                - text: By listing with Simple Delivery, you are acknowledging that you have read and agreed to the
                - link "eBay delivery Terms and Conditions - opens in new window or tab" [ref=e372] [cursor=pointer]:
                  - /url: https://pages.ebay.co.uk/shipping/delivery/seller-terms/
                  - text: eBay delivery Terms and Conditions
                  - generic: "- opens in new window or tab"
                - text: "and that they will apply to you as a seller and to all of your eligible new and existing listings. These terms include, among other important provisions:"
              - list [ref=e373]:
                - listitem [ref=e374]:
                  - text: an acknowledgment that you agree and are responsible for ensuring that your listings and items are compliant with the
                  - link "eBay delivery Terms and Conditions - opens in new window or tab" [ref=e375] [cursor=pointer]:
                    - /url: https://pages.ebay.co.uk/shipping/delivery/seller-terms/
                    - text: eBay delivery Terms and Conditions
