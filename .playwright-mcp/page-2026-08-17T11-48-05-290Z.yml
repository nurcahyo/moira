              - paragraph [ref=e393]: The contract for sale underlying the purchase of goods is directly concluded between seller and the buyer in the same manner as for transactions for which the payments entity does not manage payments.
              - paragraph [ref=e394]: "If you are a buyer completing a purchase from a seller that is using managed payments:"
              - list [ref=e395]:
                - listitem [ref=e396]: You may pay for such items using those payment methods that eBay makes available. The payments entity will receive payments from you based on your selected payment method, collect the transaction amounts on behalf of the seller and manage settlement to the seller. You agree and understand that payments received by the applicable payments entity from you satisfy your obligations to pay sellers in the amount of payments received.
                - listitem [ref=e397]: In certain instances, your transaction may be declined, frozen, or held for any reason including for suspected fraud, AML compliance, compliance with economic or trade sanctions, in connection with eBay's internal risk controls or due to potential violations of any policy of eBay or the payments entity, or a policy of one of the payments entity's third-party payments services providers.
                - listitem [ref=e398]: eBay, the payments entity or its affiliates may save payment information, such as credit card or debit card numbers, and card expiration dates, entered by you on eBay Services when you make a purchase, redeem a coupon, or make any other transaction on eBay Services where card information is entered. Such stored payment information may be used as your default payment method for future transactions on eBay Services. At any time, you can update your card information or enter new card information, at which point the new card information shall be stored as your default payment method. You may make changes to your default payment method through the Personal Information section under the Account tab in My eBay. You are responsible for maintaining the accuracy of information we have on file, and you consent to eBay updating such stored information from time to time based on information provided by you, your bank or other payments services providers. You will only provide information about payment methods that you are authorised to use.
                - listitem [ref=e399]:
