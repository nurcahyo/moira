                - text: stipulate that the responsible eBay payment entity may temporarily place a hold on your funds in certain cases upon our notification. When, under what conditions and for how long such a hold can be placed is determined by the regulations on holds in the
                - link "Payments Terms of Use - opens in new window or tab" [ref=e322] [cursor=pointer]:
