              - heading "2. About eBay" [level=2]
              - paragraph [ref=e161]: eBay is a marketplace that allows users to offer, sell and buy just about anything in a variety of pricing formats and locations.
              - paragraph [ref=e162]: eBay is not involved in the actual transaction between buyers and sellers. The contract for the sale is directly between buyer and seller. eBay is not a party to the transaction and is not a traditional auctioneer. Unless through limited programmes such as eBay Authenticity Guarantee, eBay does not have possession of anything listed or sold through eBay.
              - paragraph [ref=e163]:
                - text: While we may provide pricing, postage, listing and other guidance in our Services, such guidance is solely informational and you may decide to follow it or not. Except for certain checks, including those designed to verify that listings do not include illegal content (as described in the
                - link "Illegal and Harmful Content" [ref=e164] [cursor=pointer]:
                  - /url: "#section6"
                - text: section), eBay does not review users' listings or content. While we may help facilitate the resolution of disputes through various programmes, eBay has no control over, and, unless expressly provided, does not guarantee the existence, quality, safety or legality of, items advertised; the truth or accuracy of users' content, listings or Feedback; the ability of sellers to sell items; the ability of buyers to pay for items; or that a buyer or seller will actually complete a transaction or return an item.
              - heading "3. Using eBay" [level=2]
              - paragraph [ref=e165]: "In connection with using or accessing the Services you will not:"
              - list [ref=e166]:
                - listitem [ref=e167]: post, list or upload content or items in inappropriate categories or areas on our sites;
                - listitem [ref=e168]: breach or circumvent any laws, third-party rights or our systems or policies;
                - listitem [ref=e169]: upload illegal content or use the service in the facilitation or commission of a criminal offence;
                - listitem [ref=e170]: sell any counterfeit items or otherwise infringe the copyright, trademark or other rights of third parties;
                - listitem [ref=e171]: use our Services if you are not able to form legally binding contracts (for example if you are under 18), or are temporarily or indefinitely suspended from using our Services or are a person with whom transactions are prohibited under economic or trade sanctions;
                - listitem [ref=e172]:
                  - text: fail to pay for items purchased by you, unless you have a valid reason as set out in an eBay policy, for example, where the seller has materially changed the item's description after you bid, a clear typographical error is made, or you cannot contact the seller (see our
                  - link "Unpaid item policy" [ref=e173] [cursor=pointer]:
                    - /url: /help/policies/payment-policies/unpaid-item-policy?id=4271
                  - text: );
                - listitem [ref=e174]: fail to deliver items sold by you, unless you have a valid reason as set out in an eBay policy, for example the buyer fails to comply with the terms posted in your listing, or you cannot contact the buyer;
                - listitem [ref=e175]: manipulate the price of any item and/or interfere with any other user's listings;
                - listitem [ref=e176]:
                  - text: use comparative pricing claims that do not comply with applicable laws, regulatory guidance, the
                  - link "Pricing Tool Terms - opens in new window or tab" [ref=e177] [cursor=pointer]:
                    - /url: https://pages.ebay.co.uk/specialoffers/sellerterms.html
                    - text: Pricing Tool Terms
                    - generic: "- opens in new window or tab"
                  - text: or
                  - link "Comparative pricing policy" [ref=e178] [cursor=pointer]:
                    - /url: /help/policies/listing-policies/comparative-pricing-policy?id=4711
                  - text: ", irrespective of how such claims are displayed on eBay, including through third-party tools, integrations or APIs;"
                - listitem [ref=e179]: post false, inaccurate, misleading, defamatory, libellous or illegal content or content harmful to children;
                - listitem [ref=e180]:
                  - text: take any action that may undermine the Feedback or ratings systems (please see our
                  - link "Feedback policies" [ref=e181] [cursor=pointer]:
                    - /url: /help/policies/feedback-policies/feedback-policies?id=4208
                  - text: );
                - listitem [ref=e182]: transfer your eBay account (including Feedback) and username to another party without our consent;
                - listitem [ref=e183]:
                  - text: share your log in credentials with any third parties. If you require that authorised third parties (employees, agents, etc.) have access to your account we offer
                  - link "Multi-user account access" [ref=e184] [cursor=pointer]:
                    - /url: /help/account/multiuser-account-access/multiuser-account-access?id=5197
                  - text: for that purpose;
                - listitem [ref=e185]: distribute or post spam, unsolicited or bulk electronic communications, chain letters, or pyramid schemes;
                - listitem [ref=e186]: use the contact information of other users for any purpose other than in relation to a specific eBay transaction on the eBay site (which includes using this information to send marketing materials directly to eBay users unless the user has given explicit consent to receiving these materials);
                - listitem [ref=e187]: distribute viruses or any other technologies that may harm eBay, or the interests or property of eBay users;
                - listitem [ref=e188]: use any robot, spider, scraper, data mining tools, data gathering and extraction tools, or other automated means to access our Services for any purpose, except with the prior express permission of eBay;
                - listitem [ref=e189]: bypass our robot exclusion headers, interfere with the working of our Services, or impose an unreasonable or disproportionately large load on our infrastructure;
                - listitem [ref=e190]: export or re-export any eBay application or tools except in compliance with the export control laws of any relevant jurisdictions and in accordance with posted rules and restrictions;
                - listitem [ref=e191]: infringe the copyright, trademark, patent, moral, database or other intellectual property rights (collectively, "Intellectual Property Rights") that belong to or are licensed to eBay. Some, but not all, actions that may be infringement are reproducing, performing, displaying, distributing, copying, reverse engineering, decompiling, disassembling, or preparing derivative works from content that belongs to eBay or someone else;
                - listitem [ref=e192]: infringe any Intellectual Property Rights that belong to third parties affected by your use of the Services or post content that does not belong to you;
                - listitem [ref=e193]: commercialise any eBay application or any information or software associated with such application except with the prior express permission of eBay;
                - listitem [ref=e194]: harvest or otherwise collect or use information about users, such as email addresses, without their consent; or
                - listitem [ref=e195]: circumvent any technical measures we use to provide the Services.
              - paragraph [ref=e196]:
                - text: If you are registering with eBay as a business entity or on behalf of a business entity, you represent that you have the authority to legally bind that entity. If you are trading as a business on eBay, you must comply with all applicable laws relating to online trading for the site you are selling on (please see
                - link "Listing Conditions" [ref=e197] [cursor=pointer]:
                  - /url: "#section9"
                - text: for more information on the legal requirements for selling in the UK).
              - paragraph [ref=e198]:
                - text: You agree that we will commence supplying our Services to you as soon as you accept this User Agreement. You can cancel this User Agreement under the Consumer Contracts (Information, Cancellation and Additional Charges) Regulations 2013. Business users can cancel this User Agreement by visiting our
                - link "Closing your account" [ref=e199] [cursor=pointer]:
                  - /url: /help/account/changing-account-settings/closing-account?id=4199
                - text: help page. We may recoup the cost of any Services provided up to the point of cancellation.
              - paragraph [ref=e200]:
                - text: If (1) we believe you are violating the policy on
                - link "Offering to buy or sell outside of eBay" [ref=e201] [cursor=pointer]:
                  - /url: /help/policies/payment-policies/offers-buy-sell-outside-ebay-policy?id=4272
                - text: ", you may be subject to a range of actions, including limits on your buying and selling privileges, restrictions on listings and account features, suspension of your account, application of fees for the introduction of seller to buyer, and recovery of expenses for policy monitoring and enforcement; and (2) you are a seller and you offer or reference your contact information or ask for the buyer's contact information in the context of buying or selling outside of eBay, you will be liable for all final value fees in consideration for the introduction to a buyer for that item on the eBay site, even if the item does not sell."
              - paragraph [ref=e202]: We may cancel unconfirmed accounts or accounts that have been inactive for a long time or modify or discontinue our Services.
              - paragraph [ref=e203]: Additionally, we reserve the right to vary or terminate all or part of our Services and/or not provide all or part of our Services to anyone for any reason and/or period of time, at our discretion.
              - heading "4. Abusing eBay" [level=2]
              - paragraph [ref=e204]: "Without limiting other remedies, we may limit, suspend, or terminate your user account(s) and access to our Services, restrict or prohibit access to, and your activities on, our Services, cancel bids, remove or demote or otherwise restrict the visibility of listings, delay or remove hosted content, remove any special status associated with the account, reduce or eliminate any discounts, and take technical and legal steps to keep you from using our Services if:"
              - list [ref=e205]:
                - listitem [ref=e206]: we think that you are creating problems or possible legal liabilities for us, our users, suppliers or other third parties;
                - listitem [ref=e207]: we think that such restrictions will improve the security of the eBay community or reduce our or another eBay user's exposure to financial liabilities;
                - listitem [ref=e208]: we think that you are infringing the rights of third parties;
                - listitem [ref=e209]: we think that you are acting inconsistently with the letter or spirit of this User Agreement or our policies or abuse our employees or users;
                - listitem [ref=e210]: despite our reasonable endeavours, we are unable to verify or authenticate any information you provide to us
                - listitem [ref=e211]:
                  - text: you circumvent, or seek to circumvent, any fees that may be payable when using
                  - link "eBay.co.uk - opens in new window or tab" [ref=e212] [cursor=pointer]:
                    - /url: https://www.ebay.co.uk/
                    - text: eBay.co.uk
                    - generic: "- opens in new window or tab"
                  - text: ;
                - listitem [ref=e213]: you fail to make, or it is evident that you are unable to make, full payment of any fees due for our Services by your payment due date; or
                - listitem [ref=e214]: we think that this is necessary in order to protect other users from illegal content being posted or listed on the eBay site.
              - paragraph [ref=e215]: We may offer a process allowing users to report claimed violations for us to consider and handle through one or more of these options, all in our sole discretion.
              - paragraph [ref=e216]: When a buyer or seller issue arises we may consider the user's performance history and the specific circumstances in applying our policies. We may choose to be more lenient with policy enforcement, and to do the right thing for both buyers and sellers.
              - heading "5. Protecting Children" [level=2]
              - paragraph [ref=e217]:
                - text: You should be aged 18 or over to access and use eBay. However, to protect children from encountering content on eBay which could be harmful to them, various categories of content are prohibited under our
                - link "Prohibited and restricted items policy" [ref=e218] [cursor=pointer]:
                  - /url: /help/policies/prohibited-restricted-items/prohibited-restricted-items?id=4207
                - text: .
              - heading "6. Illegal and Harmful Content" [level=2]
              - paragraph [ref=e219]:
                - text: Our algorithms (including AI) evaluate key words, images and other criteria during the listing creation process to help identify items that are illegal, non-compliant and/or fail to comply with the
                - link "Prohibited and restricted items policy" [ref=e220] [cursor=pointer]:
                  - /url: /help/policies/prohibited-restricted-items/prohibited-restricted-items?id=4207
                - text: . These algorithms flag listings for review by eBay investigators or in some cases automatically block them from being published. We also conduct manual and AI sweeps on existing content.
              - paragraph [ref=e221]:
                - text: We implement these safeguards in a way which we consider to be proportionate to the risk that listings might pose to other users of the Services – for instance as part of our measures to protect children from content that might be harmful to them we use proactive filters and undertake more regular sweeps for the following categories of content ("
                - strong [ref=e222]: primary priority content
                - text: "\"): pornographic content; content which encourages, promotes or provides instructions for suicide; content which encourages, promotes or provides instructions for an act of deliberate self-injury; and content which encourages, promotes or provides instructions for an eating disorder or behaviours associated with an eating disorder."
              - paragraph [ref=e223]: If content is determined to be illegal, non-compliant or otherwise to violate eBay policy, it is blocked or removed and the user is notified with an explanation as to why. eBay has also developed robust measures to help stop bad actors and deter repeat policy violations, with penalties up to, and including, permanent suspension.
              - paragraph [ref=e224]: Our safeguards are also designed to minimise the length of time for which illegal content and content harmful to children is present on the eBay site. This includes terrorism content, child sexual exploitation and abuse content, other illegal content, and primary priority content.
              - paragraph [ref=e225]: We will swiftly take down content where we are alerted to or become aware of the presence of any content on the eBay site which we believe to be in breach of our policies (including illegal content and content harmful to children prohibited by our policies). Content may be taken down automatically if our algorithm flags the content as being illegal or content which is harmful to children; where content is flagged for review by an eBay investigator we will prioritise review of content that is likely to be of most harm to users.
              - paragraph [ref=e226]:
                - text: You can report content on the eBay site which you consider to be illegal or harmful to children using the
                - link "Report content" [ref=e227] [cursor=pointer]:
                  - /url: /help/account/regulatory/reporting-content-ebay?id=5412#section1
                - text: functionality.
              - paragraph [ref=e228]:
                - text: Registered authorities can report non-compliant listings via our Regulatory Portal. Law enforcement authorities can request eBay customer data via our Law Enforcement eRequest System. Learn more in our
                - link "Safety Centre - opens in new window or tab" [ref=e229] [cursor=pointer]:
                  - /url: https://pages.ebay.co.uk/safetycentre/lawEnforcement.html
                  - text: Safety Centre
                  - generic: "- opens in new window or tab"
                - text: .
              - heading "7. Appeals about Illegal and Harmful Content" [level=2]
              - paragraph [ref=e230]:
                - text: If eBay takes one of the measures referred to in the
                - link "Illegal and Harmful Content" [ref=e231] [cursor=pointer]:
                  - /url: "#section6"
                - text: section, the affected users can clarify the facts and circumstances underlying such a measure electronically by filing an appeal (free of charge) with eBay. Please note that you can make one appeal per content type. You can also request clarification through this appeals process if you have reported content that you consider to be illegal or harmful to children, but eBay has rejected this report.
              - paragraph [ref=e232]: You can lodge an appeal for a period of six months starting with the date on which eBay took the measure or informed you that your report has been rejected.
              - paragraph [ref=e233]: eBay will handle these appeals in a timely, non-discriminatory, diligent and objective manner. eBay will reverse the contested decision or measure, as far as this is technically possible and reasonable, without undue delay if we conclude that the appeal is justified.
              - heading "8. Fees" [level=2]
              - paragraph [ref=e234]:
                - text: Private seller fees for using our Services are listed on our
                - link "Fees for private sellers page" [ref=e235] [cursor=pointer]:
                  - /url: /help/selling/fees-credits-invoices/fees-private-sellers?id=4364
                - text: and business seller fees for using our Services are listed on our
                - link "Fees for business sellers page" [ref=e236] [cursor=pointer]:
                  - /url: /help/selling/fees-credits-invoices/shop-selling-fees?id=4122
                - text: . The fees we charge for selling vehicles are listed on our
                - link "Fees for selling vehicles on eBay Motors page" [ref=e237] [cursor=pointer]:
                  - /url: /help/selling/fees-credits-invoices/motors-fees?id=4127
                - text: . Fees for using the site and purchasing items including Buyer Protection, where applicable, are listed on our
                - link "eBay Buyer Protection" [ref=e238] [cursor=pointer]:
                  - /url: /help/buying/paying-items/buyer-protection-fee?id=5594
                - text: page. We may change our fees, or introduce new fees from time to time by posting the changes on the eBay site or via the
                - link "Messages section of My eBay - opens in new window or tab" [ref=e239] [cursor=pointer]:
                  - /url: https://www.ebay.co.uk/cnt/viewMessage
                  - text: Messages section of My eBay
                  - generic: "- opens in new window or tab"
                - text: 15 days in advance or, in the case of fees payable by buyers, without any advance notice. You may close your account without penalty within 30 days of such notice being given.
              - paragraph [ref=e240]: You are liable for any applicable fees arising out of all sales made using some or all eBay Services, even if sales terms are finalised or payment is made outside of eBay. In addition, if you are a seller and you offer or reference your contact information or ask for a buyer's contact information, you may be liable to pay a final value fee in consideration for the introduction to a buyer for that item on the eBay site, even if the item does not actually sell. In some cases, where buyers receive supplemental Services for items in certain categories, for example authentication, we may also charge those buyers for such supplemental Services.
              - paragraph [ref=e241]: You are required to have a valid payment method on file when selling on eBay.
              - paragraph [ref=e242]: If your payment method fails or your account is overdue, we may collect fees owed by charging other payment methods on file and retaining collection agencies or legal counsel.
              - paragraph [ref=e243]: You authorise eBay to automatically charge your chosen payment method in accordance with this User Agreement and the applicable billing agreement(s) you agree to when setting up or changing your payment method, for future charges and fees incurred in relation to the Services. This includes, but is not limited to, amounts owed for eBay fees, eBay Money Back Guarantee reimbursements and postage labels. eBay will notify you of these charges. If payments or amounts owed to eBay cannot be completed through the payment method on file for any reason, you are still required to pay eBay for all unpaid amounts and eBay reserves the right to seek reimbursement through other means plus any additional costs incurred by eBay in seeking reimbursement. You can change your payment method in My eBay at any time.
              - paragraph [ref=e244]: Seller fees don't purchase exclusive rights to item exposure on eBay whether on a web page, mobile app, or otherwise. We may display third-party advertisements (including links and references thereto), eBay advertisements (such as for eBay programmes), or other content in any part of our Services, at our sole discretion.
              - heading "9. Listing Conditions" [level=2]
              - paragraph [ref=e245]:
                - text: When listing an item, you agree to comply with the
                - link "rules for listing" [ref=e246] [cursor=pointer]:
                  - /url: /help/policies/listing-policies/listing-policies?id=4213
                - text: ", and"
                - link "Selling practices policy" [ref=e247] [cursor=pointer]:
