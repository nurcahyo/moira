              - heading "10. Purchase Conditions" [level=2]
              - paragraph [ref=e276]:
                - text: When buying an item, you agree to comply with the
                - link "rules for buyers" [ref=e277] [cursor=pointer]:
                  - /url: /help/policies/rules-policies-buyers/rules-policies-buyers?id=4206
                - text: "and that:"
              - list [ref=e278]:
                - listitem [ref=e279]: you are responsible for reading the full item listing before making a bid or commitment to buy;
                - listitem [ref=e280]: unless otherwise expressly stated by eBay on the site, you enter into a legally binding contract to purchase an item when you commit to buy an item, or if you have the winning bid (or your bid is otherwise accepted);
                - listitem [ref=e281]: for motor vehicles and real estate (property) listed in the Classified Ad format, a bid or offer is not binding, but expresses a buyer's serious interest in the item;
                - listitem [ref=e282]: if you purchase an item on an eBay site other than ebay.co.uk you are subject to the User Agreement of that other eBay site solely with respect to that particular purchase. Similarly, if you purchase an item on ebay.co.uk, you are subject to this User Agreement, even if your account was created, or is registered on, a different eBay site.
              - heading "Buyer requested cancellations" [level=3] [ref=e283]
              - paragraph [ref=e284]:
                - text: Buyers can request to cancel an order on eBay within the timeframe mentioned in our
                - link "Order cancellation policy" [ref=e285] [cursor=pointer]:
                  - /url: /help/policies/member-behavior-policies/order-cancellation-policy?id=5298
                - text: and the seller will have 3 days to accept or decline the request. If the seller declines the cancellation request, or already posted the order, buyers will need to wait until they receive the item and then decide if they want to start a return. Sellers can also cancel orders in certain circumstances up to 30 days after the sale.
              - heading "Buyer requested returns" [level=3] [ref=e286]
              - paragraph [ref=e287]:
                - text: Buyers can submit a
                - link "return request" [ref=e288] [cursor=pointer]:
                  - /url: /help/buying/returns-refunds/returning-item?id=4041
                - text: for items purchased on eBay. For returns that are eligible for
                - link "eBay Money Back Guarantee" [ref=e289] [cursor=pointer]:
                  - /url: /help/policies/ebay-money-back-guarantee-policy/ebay-money-back-guarantee-policy?id=4210
                - text: ", please see the policy for details. If the return is not covered by"
                - link "eBay Money Back Guarantee" [ref=e290] [cursor=pointer]:
                  - /url: /help/policies/ebay-money-back-guarantee-policy/ebay-money-back-guarantee-policy?id=4210
                - text: ", buyers can still request the return and the seller has the right to accept or decline the request in accordance with their return policy as stated in the original listing."
              - paragraph [ref=e291]: If you, as a buyer, return your item using a return postage label purchased on eBay and are obligated to pay for the return postage costs, we may deduct the costs of the return postage label from the amount refunded to you.
              - heading "11. International buying, selling and translation" [level=2]
              - paragraph [ref=e292]: Many of our Services are accessible internationally. We may offer certain programmes, tools, and site experiences of particular interest to international sellers and buyers, such as estimated local currency conversion and international shipping calculation tools. Sellers and buyers are responsible for complying with all laws and regulations applicable to the international sale, purchase, and shipment of items.
              - paragraph [ref=e293]: Your items may be listed on one or more of eBay's international sites in addition to ebay.co.uk. You may stop your listings from appearing on international sites by excluding international postage locations from your listings. By selecting international postage you authorise eBay, in its discretion, to display your listings on eBay sites other than the original listing site but acknowledge that your listings may not appear on some or all of these sites.
              - paragraph [ref=e294]:
                - text: When you sell your items internationally or purchase an item on an eBay site that is different from your registration site, you are subject to the User Agreement and applicable policies of that other eBay site with respect to that particular purchase, as detailed in the
                - link "International selling policy" [ref=e295] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/international-selling-policy?id=4689
                - text: .
              - paragraph [ref=e296]:
                - text: For sellers, you agree that we may display your listing for sale on an eBay site other than the site where you listed your item for sale, based on your shipping settings. You may adjust these settings as detailed in the
                - link "International selling policy" [ref=e297] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/international-selling-policy?id=4689
                - text: . If you list your items with an international shipping option, the appearance of your listings on sites other than the listing site is not guaranteed. If you sell an item on an eBay site that is different from your registration site, you are subject to the User Agreement and applicable policies, including any buyer protection programmes, of that other eBay site with respect to that particular sale, as detailed in the
                - link "International selling policy" [ref=e298] [cursor=pointer]:
                  - /url: /help/policies/selling-policies/international-selling-policy?id=4689
                - text: .
              - paragraph [ref=e299]: You authorise us to use automated tools to translate your eBay content and member to member communications, in whole or in part, into local languages where such translation solutions are available. We may provide you with tools which will enable you to translate content at your request. The accuracy or availability of any translation is not guaranteed.
              - paragraph [ref=e300]:
                - text: One of the ways we make ebay.co.uk listings available to international buyers is through the eBay International Shipping Programme ("EIS"). EIS enables buyers to obtain parcel processing, international shipping, and customs clearance services. It is facilitated by eBay through third-party service providers that eBay has contracted with to operationalise the programme. By listing your item on ebay.co.uk and not opting out of EIS, you will also be acknowledging that you have read and agreed to the
                - link "EIS Terms and Conditions - opens in new window or tab" [ref=e301] [cursor=pointer]:
                  - /url: https://pages.ebay.co.uk/internationalshippingprogram/seller/terms/
                  - text: EIS Terms and Conditions
                  - generic: "- opens in new window or tab"
                - text: and that they will apply to you as a seller and to all of your eligible new and existing listings. If you choose not to participate in EIS, you can opt out of the programme by updating your postage preferences.
              - paragraph [ref=e302]:
                - text: See
                - link "eBay International Shipping - opens in new window or tab" [ref=e303] [cursor=pointer]:
                  - /url: https://www.ebay.co.uk/sellercentre/postage/ebay-international-shipping
                  - text: eBay International Shipping
                  - generic: "- opens in new window or tab"
                - text: for more details.
              - heading "12. Content" [level=2]
              - paragraph [ref=e304]: When providing us with content (including causing content to be posted using our Services), you grant us a non-exclusive, worldwide, perpetual (or for the duration of any copyright or other rights in such content), irrevocable, royalty-free, sublicensable (through multiple tiers) right to use the content (including, without limitation, creating and using derivative works). We may in particular use your content, including any photographs you upload, for marketing and promotional purposes. This includes (i) offering it to other sellers to use in their listings, and (ii) displaying it to other eBay users as part of the browsing experience on eBay. We will also be allowed to keep a copy of any content (including photographs) you upload in our product catalogue for subsequent use for these purposes. You authorise us to exercise any and all copyright, trademark, publicity, database or other intellectual property rights you have in or to the content in any media known now or developed in the future for these purposes. Further, to the fullest extent permitted under applicable law, you waive your moral rights in the content and promise not to assert such rights or any other intellectual property rights you have in the content against us, our sublicensees or our assignees.
              - paragraph [ref=e305]: We may offer catalogue and/or product data (including images, descriptions and specifications) that are provided by third parties (including eBay users). You may use that content solely in your eBay listings during the time your listings are on eBay's sites. That permission is subject to modification or revocation at any time at eBay's sole discretion.
              - paragraph [ref=e306]: We try to offer reliable data, but cannot promise that the content provided through the Services will always be available, accurate, complete and up-to-date. You agree that eBay is not responsible for examining or warranting the listings or content provided by third parties through the Services for accuracy, and that you will not hold or attempt to hold us or our product data providers liable for inaccuracies. If you choose to use catalogue content and/or product data in connection with your listings, you agree to ensure that the content directly associated with your listings is and remains accurate, and that you continue to fully comply with this User Agreement and all eBay policies. The catalogue and product data include copyrighted, trademarked and other proprietary materials. You agree not to remove any copyright, proprietary or identification markings in the catalogue or product data or create any derivative works based on that data (other than by including the data in your listings).
              - paragraph [ref=e307]: The name "eBay" and other eBay marks, logos, designs and phrases that we use in connection with our Services are trademarks, service marks, or trade dress of eBay in the UK and other countries. They may not be used unless expressly authorised by eBay in writing.
              - heading "13. Data protection and Privacy" [level=2]
              - list [ref=e308]:
                - listitem [ref=e309]: You and eBay shall process personal data received under and/or in connection with this User Agreement each as a separate and independent controller. In no event will eBay and you process personal data under and/or in connection with this User Agreement as joint controllers or in a controller-to-processor relationship. As such separate and independent controllers, you shall be individually and separately responsible for complying with the obligations that apply to you as a controller under applicable data protection laws.
                - listitem [ref=e310]: You shall comply with your obligations under applicable data protection laws (including but not limited to Regulation (EU) 2016/679 (EU General Data Protection Regulation "GDPR") as it forms part of the law of England and Wales, Scotland and Northern Ireland by virtue of section 3 of the European Union (Withdrawal) Act 2018, and as subsequently amended) and supplementing local data protection laws. This includes, but is not limited to, the obligation to provide appropriate safeguards for the transfer of personal data to a third country or an international organisation.
                - listitem [ref=e311]: You shall process personal data received from eBay exclusively for the purpose(s) you received the personal data under and/or in connection with this User Agreement. You shall erase the personal data received under this User Agreement immediately after the respective purpose(s) has/have been fulfilled. Any further processing of the personal data is not permitted except when legally required (e.g. if a retention obligation applies).
                - listitem [ref=e312]: Failure to abide by the aforementioned obligations may result in disciplinary action up to and including account suspension.
                - listitem [ref=e313]: As part of the Services, eBay has access to various information about users, including personal data. This includes information that users submit to eBay as part of the Services (such as contact information or item descriptions) as well as information that is generated by the provision and processing of the Services (such as ratings, sales analysis or communication).
                - listitem [ref=e314]:
                  - text: Via My eBay and, upon request, via
                  - link "selling tools" [ref=e315] [cursor=pointer]:
                    - /url: /help/selling/selling-tools/selling-tools-overview?id=4073
                  - text: ", you receive information which is necessary for the processing of transactions (in particular, the contact information of the other user involved in a transaction) as well as aggregated information on the performance and analysis of your listings, which are partly related to the data of other users of the Services (such as number of impressions of a listing, conversion rate or return rate)."
                - listitem [ref=e316]: eBay only shares information about users with third parties if this is necessary for the provision of the Services or if eBay is legally or contractually entitled to do so.
                - listitem [ref=e317]: Upon expiry of this User Agreement, we will delete the information you provided, or which was generated through your use of the Services from your eBay account. Regardless, we maintain this information after the expiry of the User Agreement if we are legally obliged or have a legitimate interest to do so. We will generally maintain aggregated data generated using the Services (e.g. statistics about sales in a category) upon expiry of the User Agreement.
                - listitem [ref=e318]:
                  - text: For information regarding the processing of personal data by eBay, including sharing such data with third parties and your rights as a data subject, please see our
                  - link "User Privacy Notice" [ref=e319] [cursor=pointer]:
                    - /url: /help/policies/member-behavior-policies/user-privacy-notice-privacy-policy?id=4260
                  - text: .
              - heading "14. Restricting Funds" [level=2]
              - paragraph [ref=e320]:
                - text: The
                - link "Payments Terms of Use - opens in new window or tab" [ref=e321] [cursor=pointer]:
                  - /url: https://pages.ebay.co.uk/payment/2.0/terms.html
                  - text: Payments Terms of Use
