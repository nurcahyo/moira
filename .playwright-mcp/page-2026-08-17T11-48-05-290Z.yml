              - paragraph [ref=e421]: Regardless of the previous paragraphs, if we are found to be liable, our liability to you or to any third party is limited to the greater of (a) any amounts due under the eBay Money Back Guarantee up to the price the item sold for on eBay and its original postage costs, (b) the amount of fees in dispute not to exceed the total fees which you paid to us in the 12 months prior to the action giving rise to the liability, or (c) £100.
