name: ci

on:
  pull_request:
  push:
    branches:
      - main
  # Manual trigger against an arbitrary ref. Added 2026-07-31 because GitHub stopped
  # producing runs for `pull_request` events on this repository while `push` runs kept
  # working — PR #39 sat with zero check-runs across a synchronize, a close/reopen and a
  # fresh commit. This is the honest way to get real CI on a branch when the event never
  # arrives; the alternative is merging on local gates alone, which is exactly the
  # "a gate you did not run is not a gate that passed" trap.
  workflow_dispatch:

# Sharding multiplies the cost of a superseded run by the shard count. `main` is
# excluded so a merge push is never cancelled by the next merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  SHARD_TOTAL: "5" # MUST equal the length of rust-shard's matrix (see `strategy.matrix.shard`,
                   # a few dozen lines below — kept close on purpose). Both mismatch directions
                   # fail closed: too few matrix entries leaves a bucket unrun and the union gate
                   # reports `union-incomplete`; too many makes the extra shard exit 2 on
                   # `idx >= total`. It is still two numbers that must agree in one file.

jobs:
  # ── The Rust half, sharded ───────────────────────────────────────────────────────
  #
  # Five jobs replace one. `rust` used to be a single 9-minute job that ran fmt,
  # clippy, the whole 48-target suite and a migration check in sequence; the suite
  # alone was 5m20 of it. The parallelism here comes from GitHub job isolation, not
  # from a change to the test harness: `tests/support/mod.rs` is untouched, each shard
  # gets its OWN Postgres and Redis service container on its OWN runner, and inside a
  # shard the execution model is exactly today's — one process per binary, sequential,
  # CONCURRENT_FIXTURES = 4. Every hazard the ledger documents (template-digest sweep
  # races, 3D000, 57P01, the 40-minute advisory-lock deadlock, FIXTURE_BUDGET's
  # max_connections calibration) keeps today's semantics by construction.
  #
  # The check to require in branch protection is `rust` — the aggregator at the bottom.
  # NEVER require `rust-shard (0)`…`(4)`: matrix check names embed the index and change
  # every time SHARD_TOTAL is re-tuned, which silently un-gates the branch.

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Its OWN key, deliberately. `cargo clippy` runs under RUSTC_WORKSPACE_WRAPPER
          # and emits metadata-only artifacts; `cargo test` needs full codegen. They are
          # mutually unusable — the old single-job log shows 38.3s of "Checking moira"
          # followed by a from-scratch 94s "Compiling moira" under the identical feature
          # set. Worse, GitHub cache keys are IMMUTABLE and first-writer-wins: if this
          # ~69s job shared the shards' key it would win the reservation on nearly every
          # run and publish a target/ containing only clippy's .rmeta. The shards would
          # log "Unable to reserve cache", save nothing, and every subsequent run would
          # recompile all 405 dependencies from cold — silently, permanently, green.
          # DO NOT merge these keys.
          shared-key: rust-lint
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # REQUIRED: one failing shard must not cancel its siblings — that destroys the
      # evidence the `rust` aggregator needs, and reintroduces "a failure truncated the
      # run" as a confounder for the completeness gate.
      fail-fast: false
      matrix:
        # MUST have exactly SHARD_TOTAL entries (declared at the top of this file).
        shard: [0, 1, 2, 3, 4]
    # Copied verbatim from the old single `rust` job. Every matrix leg gets its own
    # containers on its own runner, which is what makes "no two shards share a Postgres"
    # true by construction rather than by convention.
    #
    # Service topology is UNIFORM across shards on purpose. Only 4 of 48 targets need no
    # Postgres and only one needs Redis; packing by service would save ~4s and put
    # ci/test-costs.tsv on the correctness path — a target that starts using Redis would
    # land on a Redis-less shard.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: moira
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOIRA_DATABASE__URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_DATABASE__REQUIRE: true
      MOIRA_REDIS__ENABLED: true
      MOIRA_REDIS__URL: redis://localhost:6379/0
      MOIRA_SECRETS__ALLOW_INSECURE_DEV_KEY: true
      MOIRA_API_KEYS__ALLOW_INSECURE_DEV_PEPPER: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          # ONLY shard 0 writes. Five concurrent savers against one immutable key means
          # four "Unable to reserve cache" warnings per run and a coin-flip over which
          # partial target/ wins. `Swatinem/rust-cache` prunes workspace artifacts before
          # saving, so what is stored is the dependency graph — which is shard-independent
          # — not shard 0's ~10 test binaries.
          save-if: ${{ matrix.shard == 0 }}
      # A script file, not an inline `cargo` line: a PreToolUse hook in this project's
      # local tooling rewrites an outer `cargo` command and replaces its output with a
      # one-line summary even when redirected. Cargo inside a script file is immune, and
      # the same script is what a developer runs to reproduce a shard locally.
      - run: scripts/ci-shard-run.sh "${{ matrix.shard }}" "$SHARD_TOTAL"
      - name: Upload shard manifest
        # `always()`: the manifest is MORE interesting when the shard failed. Without it
        # a failing shard uploads nothing, the aggregator sees no ran.txt, and
        # "one target failed" would be reported as "ten targets never ran".
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-shard-manifest-${{ matrix.shard }}
          path: shard-out/
          retention-days: 7
          if-no-files-found: error

  rust-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Its own instance with the target database created by initdb. Replaces
          # `createdb -h localhost -U postgres moira_migration_test` on a shared server:
          # "genuinely fresh" becomes a property of the infrastructure rather than of one
          # shell command that has to be the first thing that ever touched the name. It
          # also drops the `postgresql-client` dependency.
          POSTGRES_DB: moira_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moira_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Present so that a failure here can never be explained away with "the environment
      # differed from the shards".
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOIRA_DATABASE__URL: postgres://postgres:postgres@localhost:5432/moira_migration_test
      MOIRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moira_migration_test
      MOIRA_DATABASE__REQUIRE: true
      MOIRA_REDIS__ENABLED: true
      MOIRA_REDIS__URL: redis://localhost:6379/0
      MOIRA_SECRETS__ALLOW_INSECURE_DEV_KEY: true
      MOIRA_API_KEYS__ALLOW_INSECURE_DEV_PEPPER: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          # Reader only. This job builds one target; letting it save would publish a
          # target/ far thinner than the shards'.
          save-if: false
      - name: Verify migrations against clean pgvector PostgreSQL
        # `--all-features` is NEW. The old step omitted it while the suite above used it,
        # so the two had different feature fingerprints and this step paid a full
        # `Compiling moira` — a measured 39.12s to run one 0.50s test. The only feature is
        # `test-routes` (two probe routes, `compile_error!`-guarded against optimized
        # builds, inert under debug_assertions), so it should be a no-op — but it is a
        # behaviour change to a security gate and must be OBSERVED green, not assumed.
        run: >-
          cargo test --all-features --test security_foundation
          security_foundation_migration_creates_contract_tables_when_configured
          -- --exact --nocapture

  # The aggregator. Named `rust` because that is today's check name and the name the
  # EXECUTION-LEDGER's standing authority uses, and because it is invariant under
  # re-sharding: a future branch-protection rule can be written against it without
  # knowing the shard count.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [rust-lint, rust-shard, rust-migrations]
    # Runs even when a dependency fails — that is the whole point. A completeness gate
    # that only runs on the happy path proves nothing about the unhappy one.
    if: always()
    steps:
      - uses: actions/checkout@v4
      # RESULT ASSERTION FIRST, union gate second. If a shard failed, that must be
      # reported as "a shard failed" — not as "ten targets never ran", which is what the
      # union gate would say about the same run.
      - name: Assert every rust job succeeded
        env:
          LINT: ${{ needs.rust-lint.result }}
          SHARDS: ${{ needs.rust-shard.result }}
          MIGRATIONS: ${{ needs.rust-migrations.result }}
        run: |
          set -euo pipefail
          rc=0
          for pair in "rust-lint:$LINT" "rust-shard:$SHARDS" "rust-migrations:$MIGRATIONS"; do
              name=${pair%%:*}; result=${pair#*:}
              # Anything other than success — failure, cancelled, skipped — is not a pass.
              # `if: always()` is what makes this job RUN when a dependency fails; without
              # the loop, a *skipped* dependency would read as green, which is the
              # toothless-guard shape this repo has catalogued thirteen times.
              [ "$result" = "success" ] || { printf 'FAILED — %s: %s\n' "$name" "$result"; rc=1; }
          done
          exit "$rc"
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-shard-manifest-*
          path: manifests
      # Derives the expected set from THIS job's own fresh checkout (`ls tests/*.rs` plus
      # the three pseudo-units) and diffs it against what the shards' logs say ran.
      # Never reads ci/test-costs.tsv, never a hardcoded count.
      - run: scripts/ci-assert-union.sh manifests

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  container-and-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      # `engineerd/setup-kind@v0.6.2` was here and was removed rather than repinned. It failed with
      # `File not found: .../v0.6.2/dist/main/index.js` — the tag exists but ships no built action —
      # and, more to the point, **nothing in this job ever used the cluster it created**. Every
      # remaining step is offline: `docker build` needs no Kubernetes, and `helm lint`,
      # `helm template` and `kubeconform` are all static validation. It was spending minutes
      # standing up a cluster for nobody.
      #
      # If a deploy smoke test is wanted later, add it deliberately along with the steps that
      # exercise it, rather than restoring a cluster that no step consumes.
      - run: docker build -t moira:ci .
      # `0.28.0` did not resolve: this action's tags are v-prefixed (`v0.36.0`, `v0.35.0`, …),
      # so the unprefixed ref matched nothing and the job died before running a single step.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moira:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - run: helm lint charts/moira
      - run: helm template moira charts/moira > /tmp/moira-rendered.yaml
      # `yannh/kubeconform-action` does not exist — the GitHub API returns 404 for that
      # repository. Only `yannh/kubeconform`, the tool itself, is real. Installing the released
      # binary directly removes the dependency on a wrapper action that was never published.
      - name: Validate rendered manifests with kubeconform
        run: |
          set -euo pipefail
          version=v0.6.7
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          "$RUNNER_TEMP/bin/kubeconform" -ignore-missing-schemas -summary /tmp/moira-rendered.yaml

  # Frontend gate for the Next.js admin console. Everything here is scoped to
  # `console/` and shares nothing with the Rust jobs, so it runs in parallel with
  # them rather than behind them.
  console:
    runs-on: ubuntu-latest
    # Playwright can hang rather than fail; a job-level cap turns that into a red
    # run instead of a runner held for six hours.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: console
    # The console owns its own database (`console_auth`) — Better Auth's session,
    # account and jwks tables plus the provider-secret store. It is deliberately
    # separate from Moira's: different lifecycle, different secrets, and the console
    # is the internet-facing half.
    #
    # Plain `postgres` rather than the `pgvector` image the `rust` job uses; the
    # console stores no embeddings and pulling a larger image would buy nothing.
    #
    # Without this service the console's database suites fail **loudly** with
    # "cannot reach PostgreSQL … Set CONSOLE_SKIP_DB_TESTS=1 to disable deliberately"
    # — by design. That flag reds a separate availability test on purpose, so a CI
    # run cannot quietly skip the durability guarantees this job exists to prove.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: console_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONSOLE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/console_auth_test
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in `console/package.json`'s `packageManager`
      # field and in `console/Dockerfile`'s BUN_VERSION. Three places, one
      # number: a bump that misses one of them produces a CI run that does not
      # match the image it is gating.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Playwright IS run here. The suite qualifies for an unattended gate: the
      # config's own header states it talks to no Moira instance and no auth
      # provider, its `webServer` builds and starts the standalone server the
      # image ships, and it already sets `retries: 2` and `workers: 1` under CI.
      # The specs it runs — smoke, axe a11y, and the secret-leak tap — are
      # exactly the checks that are worthless if they only ever run on a laptop.
      #
      # Browser install is its own step on purpose: an apt/CDN failure inside
      # `playwright install` and a genuine test failure are different incidents,
      # and folding them into one step makes the log the only way to tell them
      # apart.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      # NO `E2E_SKIP_BUILD`. It used to be set here, to reuse the `bun run build`
      # output from the step above — and that made the secret-leak gate's
      # BUILD-OUTPUT scan vacuous on every CI run.
      #
      # The build step above runs under this job's `env:`, which contains only
      # `CONSOLE_TEST_DATABASE_URL`. The e2e sentinels live in
      # `console/e2e/support/secrets.ts` and reach the server through
      # `webServer.env`, so a `.next` produced by that step never contained them.
      # A scan for a value that was never in the build's environment finds
      # nothing and reports success.
      #
      # REPRODUCED before removing it (plan 09 wave 3): a statically prerendered
      # `/` rendering `{process.env.MOIRA_E2E_SENTINEL_SYSTEM_KEY}`, built from a
      # sentinel-free shell and run with `E2E_SKIP_BUILD=1`, gave 13 passed /
      # exit 0. `console/e2e/secret-leak.e2e.ts:96-102` had recorded this hazard
      # in prose and stated the flag "must not be used for a gating run"; this
      # workflow was using it for exactly that.
      #
      # `playwright.config.ts` now refuses the flag under CI outright, so
      # re-adding this line fails loudly instead of quietly going green. The cost
      # is one extra Next build (~3s on this project).
      - name: Playwright e2e
        run: bun run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: console/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # A separate job from `container-and-helm`, not extra steps inside it.
  #
  # The two share no inputs: that job builds the Rust image from the repo root
  # Dockerfile and validates `charts/moira`; this one builds the console image
  # from `console/` and validates `charts/moira-console`. Appending these steps
  # there would serialise two independent multi-minute image builds behind one
  # another and collapse two unrelated failure causes into a single red check —
  # "container-and-helm failed" would no longer say which half broke. Two jobs
  # run concurrently and name their own failure. The only duplication is the
  # kubeconform download, which is a two-second curl.
  console-container-and-helm:
    runs-on: ubuntu-latest
    permissions:
      # Deliberately narrower than `container-and-helm`'s. Trivy runs with
      # `format: table` and uploads no SARIF, so `security-events: write` would
      # be an unused write scope on a job that builds an internet-facing image.
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      # Build context is `console/`, matching the COPY paths in its Dockerfile.
      - run: docker build -t moira-console:ci console
      # Same action version, same exit-code and same severity floor as the Moira
      # image. No `--ignore-unfixed` and no `.trivyignore`: the console is the
      # internet-facing half, so it is the last place to start accepting a
      # CRITICAL because no patch has shipped yet.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moira-console:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - run: helm lint charts/moira-console
      - run: helm template moira-console charts/moira-console > /tmp/moira-console-rendered.yaml
      # Default values leave ingress, HPA, the created Secret and the migration
      # job unrendered, so a syntax error in any of those four templates would
      # ship green. This second render turns them all on — and doubles as a test
      # of the chart's own `fail` guards, since an invalid combination here stops
      # the job.
      - name: Render every optional template
        run: |
          set -euo pipefail
          helm template moira-console charts/moira-console \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set secret.create=true \
            --set secret.data.BETTER_AUTH_SECRET=ci-placeholder-not-a-real-secret \
            --set networkPolicy.moira.namespace=moira-system \
            --set migrationJob.enabled=true \
            --set migrationJob.image.repository=ghcr.io/example/moira-console-migrate \
            --set 'migrationJob.command={node,node_modules/@better-auth/cli/dist/index.js,migrate,--yes}' \
            > /tmp/moira-console-rendered-all.yaml
      - name: Validate rendered manifests with kubeconform
        run: |
          set -euo pipefail
          version=v0.6.7
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          "$RUNNER_TEMP/bin/kubeconform" -ignore-missing-schemas -summary \
            /tmp/moira-console-rendered.yaml \
            /tmp/moira-console-rendered-all.yaml
