name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: moira
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOIRA_DATABASE__URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_DATABASE__REQUIRE: true
      MOIRA_REDIS__ENABLED: true
      MOIRA_REDIS__URL: redis://localhost:6379/0
      MOIRA_SECRETS__ALLOW_INSECURE_DEV_KEY: true
      MOIRA_API_KEYS__ALLOW_INSECURE_DEV_PEPPER: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Verify migrations against clean pgvector PostgreSQL
        run: >-
          cargo test --test security_foundation
          security_foundation_migration_creates_contract_tables_when_configured
          -- --exact --nocapture

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  container-and-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      - uses: engineerd/setup-kind@v0.6.2
      - run: docker build -t moira:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: moira:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - run: helm lint charts/moira
      - run: helm template moira charts/moira > /tmp/moira-rendered.yaml
      - uses: yannh/kubeconform-action@v0.6.7
        with:
          files: /tmp/moira-rendered.yaml
          ignore-missing-schemas: true
