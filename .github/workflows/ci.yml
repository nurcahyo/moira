name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: moira
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOIRA_DATABASE__URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_DATABASE__REQUIRE: true
      MOIRA_REDIS__ENABLED: true
      MOIRA_REDIS__URL: redis://localhost:6379/0
      MOIRA_SECRETS__ALLOW_INSECURE_DEV_KEY: true
      MOIRA_API_KEYS__ALLOW_INSECURE_DEV_PEPPER: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Verify migrations against clean pgvector PostgreSQL
        env:
          PGPASSWORD: postgres
          MOIRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moira_migration_test
        run: >-
          createdb -h localhost -U postgres moira_migration_test &&
          cargo test --test security_foundation
          security_foundation_migration_creates_contract_tables_when_configured
          -- --exact --nocapture

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  container-and-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      - uses: engineerd/setup-kind@v0.6.2
      - run: docker build -t moira:ci .
      # `0.28.0` did not resolve: this action's tags are v-prefixed (`v0.36.0`, `v0.35.0`, …),
      # so the unprefixed ref matched nothing and the job died before running a single step.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moira:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - run: helm lint charts/moira
      - run: helm template moira charts/moira > /tmp/moira-rendered.yaml
      # `yannh/kubeconform-action` does not exist — the GitHub API returns 404 for that
      # repository. Only `yannh/kubeconform`, the tool itself, is real. Installing the released
      # binary directly removes the dependency on a wrapper action that was never published.
      - name: Validate rendered manifests with kubeconform
        run: |
          set -euo pipefail
          version=v0.6.7
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          "$RUNNER_TEMP/bin/kubeconform" -ignore-missing-schemas -summary /tmp/moira-rendered.yaml
