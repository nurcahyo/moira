name: ci

on:
  pull_request:
  push:
    branches:
      - main
      # `develop` is where this repository actually does its work; `main` is the
      # promotion branch it is merged into later. Until this line existed, EVERY merge
      # into develop ran no CI at all — the push filter matched only `main`, and a
      # topic-branch PR's run tests the PR's merge commit, not what develop looks like
      # afterwards. Three separate agents worked around it by hand with
      # `gh workflow run ci.yml --ref develop`, and one of them recorded that the
      # automatic run this workflow's instructions assumed "does not exist
      # structurally". A branch that is merged into daily and never automatically
      # tested is the loudest available version of "a gate you did not run is not a
      # gate that passed".
      - develop
  # Manual trigger against an arbitrary ref. Added 2026-07-31 because GitHub stopped
  # producing runs for `pull_request` events on this repository while `push` runs kept
  # working — PR #39 sat with zero check-runs across a synchronize, a close/reopen and a
  # fresh commit. This is the honest way to get real CI on a branch when the event never
  # arrives; the alternative is merging on local gates alone, which is exactly the
  # "a gate you did not run is not a gate that passed" trap.
  workflow_dispatch:

# THE workflow-level concurrency block. There is exactly one and there must stay
# exactly one — a second `concurrency:` at job level would serialise the shards against
# each other rather than dedupe runs, which is the opposite of what this is for.
#
# Sharding multiplies the cost of a superseded run by the shard count, so a fresh push
# to a ref cancels that ref's in-flight run. `main` is excluded: cancelling a run on the
# promotion branch destroys the evidence that a release commit was green. `develop` is
# deliberately NOT excluded — a superseded develop run is merely stale, and the run for
# the newer commit supersedes it with strictly better information.
#
# On whether adding `develop` to the push trigger above double-runs anything: for the
# ordinary flow, no. The group key is `github.ref`, which is already distinct per event
# (`refs/pull/N/merge` for `pull_request`, `refs/heads/X` for `push`), but the two
# events do not both fire in the first place — a topic-branch → develop PR fires
# `pull_request` only, because the topic branch does not match the push filter, and the
# merge into develop fires `push` only, because no PR has develop as its head.
#
# One overlap is real and is accepted on purpose: while a develop → main promotion PR is
# open, a push to develop fires both `push` (refs/heads/develop) and `pull_request`
# synchronize (refs/pull/N/merge). Those are different refs AND different commits — the
# branch head versus GitHub's merge commit against main — so both runs are genuine
# evidence about different trees, and the promotion PR is rare. They could only be
# collapsed by re-keying this group on commit SHA, which would destroy supersession for
# the far more common case of pushing twice to one branch. Ten shards occasionally beats
# never cancelling a superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  SHARD_TOTAL: "5" # MUST equal the length of rust-shard's matrix (see `strategy.matrix.shard`,
                   # a few dozen lines below — kept close on purpose). Both mismatch directions
                   # fail closed: too few matrix entries leaves a bucket unrun and the union gate
                   # reports `union-incomplete`; too many makes the extra shard exit 2 on
                   # `idx >= total`. It is still two numbers that must agree in one file.

jobs:
  # ── The Rust half, sharded ───────────────────────────────────────────────────────
  #
  # Five jobs replace one. `rust` used to be a single 9-minute job that ran fmt,
  # clippy, the whole 48-target suite and a migration check in sequence; the suite
  # alone was 5m20 of it. The parallelism here comes from GitHub job isolation, not
  # from a change to the test harness: `tests/support/mod.rs` is untouched, each shard
  # gets its OWN Postgres and Redis service container on its OWN runner, and inside a
  # shard the execution model is exactly today's — one process per binary, sequential,
  # CONCURRENT_FIXTURES = 4. Every hazard the ledger documents (template-digest sweep
  # races, 3D000, 57P01, the 40-minute advisory-lock deadlock, FIXTURE_BUDGET's
  # max_connections calibration) keeps today's semantics by construction.
  #
  # The check to require in branch protection is `rust` — the aggregator at the bottom.
  # NEVER require `rust-shard (0)`…`(4)`: matrix check names embed the index and change
  # every time SHARD_TOTAL is re-tuned, which silently un-gates the branch.

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Its OWN key, deliberately. `cargo clippy` runs under RUSTC_WORKSPACE_WRAPPER
          # and emits metadata-only artifacts; `cargo test` needs full codegen. They are
          # mutually unusable — the old single-job log shows 38.3s of "Checking moira"
          # followed by a from-scratch 94s "Compiling moira" under the identical feature
          # set. Worse, GitHub cache keys are IMMUTABLE and first-writer-wins: if this
          # ~69s job shared the shards' key it would win the reservation on nearly every
          # run and publish a target/ containing only clippy's .rmeta. The shards would
          # log "Unable to reserve cache", save nothing, and every subsequent run would
          # recompile all 405 dependencies from cold — silently, permanently, green.
          # DO NOT merge these keys.
          shared-key: rust-lint
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # REQUIRED: one failing shard must not cancel its siblings — that destroys the
      # evidence the `rust` aggregator needs, and reintroduces "a failure truncated the
      # run" as a confounder for the completeness gate.
      fail-fast: false
      matrix:
        # MUST have exactly SHARD_TOTAL entries (declared at the top of this file).
        shard: [0, 1, 2, 3, 4]
    # Copied verbatim from the old single `rust` job. Every matrix leg gets its own
    # containers on its own runner, which is what makes "no two shards share a Postgres"
    # true by construction rather than by convention.
    #
    # Service topology is UNIFORM across shards on purpose. Only 4 of 48 targets need no
    # Postgres and only one needs Redis; packing by service would save ~4s and put
    # ci/test-costs.tsv on the correctness path — a target that starts using Redis would
    # land on a Redis-less shard.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: moira
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOIRA_DATABASE__URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moira
      MOIRA_DATABASE__REQUIRE: true
      MOIRA_REDIS__ENABLED: true
      MOIRA_REDIS__URL: redis://localhost:6379/0
      MOIRA_SECRETS__ALLOW_INSECURE_DEV_KEY: true
      MOIRA_API_KEYS__ALLOW_INSECURE_DEV_PEPPER: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          # ONLY shard 0 writes. Five concurrent savers against one immutable key means
          # four "Unable to reserve cache" warnings per run and a coin-flip over which
          # partial target/ wins. `Swatinem/rust-cache` prunes workspace artifacts before
          # saving, so what is stored is the dependency graph — which is shard-independent
          # — not shard 0's ~10 test binaries.
          save-if: ${{ matrix.shard == 0 }}
      # A script file, not an inline `cargo` line: a PreToolUse hook in this project's
      # local tooling rewrites an outer `cargo` command and replaces its output with a
      # one-line summary even when redirected. Cargo inside a script file is immune, and
      # the same script is what a developer runs to reproduce a shard locally.
      - run: scripts/ci-shard-run.sh "${{ matrix.shard }}" "$SHARD_TOTAL"
      - name: Upload shard manifest
        # `always()`: the manifest is MORE interesting when the shard failed. Without it
        # a failing shard uploads nothing, the aggregator sees no ran.txt, and
        # "one target failed" would be reported as "ten targets never ran".
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-shard-manifest-${{ matrix.shard }}
          path: shard-out/
          retention-days: 7
          if-no-files-found: error

  rust-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Its own instance with the target database created by initdb. Replaces
          # `createdb -h localhost -U postgres moira_migration_test` on a shared server:
          # "genuinely fresh" becomes a property of the infrastructure rather than of one
          # shell command that has to be the first thing that ever touched the name. It
          # also drops the `postgresql-client` dependency.
          POSTGRES_DB: moira_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moira_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Present so that a failure here can never be explained away with "the environment
      # differed from the shards".
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOIRA_DATABASE__URL: postgres://postgres:postgres@localhost:5432/moira_migration_test
      MOIRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moira_migration_test
      MOIRA_DATABASE__REQUIRE: true
      MOIRA_REDIS__ENABLED: true
      MOIRA_REDIS__URL: redis://localhost:6379/0
      MOIRA_SECRETS__ALLOW_INSECURE_DEV_KEY: true
      MOIRA_API_KEYS__ALLOW_INSECURE_DEV_PEPPER: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          # Reader only. This job builds one target; letting it save would publish a
          # target/ far thinner than the shards'.
          save-if: false
      - name: Verify migrations against clean pgvector PostgreSQL
        # `--all-features` is NEW. The old step omitted it while the suite above used it,
        # so the two had different feature fingerprints and this step paid a full
        # `Compiling moira` — a measured 39.12s to run one 0.50s test. The only feature is
        # `test-routes` (two probe routes, `compile_error!`-guarded against optimized
        # builds, inert under debug_assertions), so it should be a no-op — but it is a
        # behaviour change to a security gate and must be OBSERVED green, not assumed.
        run: >-
          cargo test --all-features --test security_foundation
          security_foundation_migration_creates_contract_tables_when_configured
          -- --exact --nocapture

  # The aggregator. Named `rust` because that is today's check name and the name the
  # EXECUTION-LEDGER's standing authority uses, and because it is invariant under
  # re-sharding: a future branch-protection rule can be written against it without
  # knowing the shard count.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [rust-lint, rust-shard, rust-migrations]
    # Runs even when a dependency fails — that is the whole point. A completeness gate
    # that only runs on the happy path proves nothing about the unhappy one.
    if: always()
    steps:
      - uses: actions/checkout@v4
      # RESULT ASSERTION FIRST, union gate second. If a shard failed, that must be
      # reported as "a shard failed" — not as "ten targets never ran", which is what the
      # union gate would say about the same run.
      - name: Assert every rust job succeeded
        env:
          LINT: ${{ needs.rust-lint.result }}
          SHARDS: ${{ needs.rust-shard.result }}
          MIGRATIONS: ${{ needs.rust-migrations.result }}
        run: |
          set -euo pipefail
          rc=0
          for pair in "rust-lint:$LINT" "rust-shard:$SHARDS" "rust-migrations:$MIGRATIONS"; do
              name=${pair%%:*}; result=${pair#*:}
              # Anything other than success — failure, cancelled, skipped — is not a pass.
              # `if: always()` is what makes this job RUN when a dependency fails; without
              # the loop, a *skipped* dependency would read as green, which is the
              # toothless-guard shape this repo has catalogued thirteen times.
              [ "$result" = "success" ] || { printf 'FAILED — %s: %s\n' "$name" "$result"; rc=1; }
          done
          exit "$rc"
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-shard-manifest-*
          path: manifests
      # Derives the expected set from THIS job's own fresh checkout (`ls tests/*.rs` plus
      # the three pseudo-units) and diffs it against what the shards' logs say ran.
      # Never reads ci/test-costs.tsv, never a hardcoded count.
      - run: scripts/ci-assert-union.sh manifests

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  # ── Supply-chain scanning, issue #98 ─────────────────────────────────────────────
  #
  # Two NEW jobs, plus an SBOM step inside each image build (see `container-and-helm`
  # and `console-container-and-helm` below). They are jobs rather than steps appended
  # to `supply-chain` for the reason `console-container-and-helm` already documents:
  # they share no inputs with `cargo audit`/`cargo deny`, they name their own failure
  # instead of collapsing three causes into one red check, and they run BESIDE the five
  # Rust shards rather than behind them. Neither is near the critical path, which is set
  # by `container-and-helm` (~5m55s).
  #
  # `cargo audit`/`cargo deny` above are SCA — known CVEs in declared dependencies.
  # `sast` is a different question (patterns in code we wrote), and `secret-scan` a
  # third (credentials in the history). None of the three subsumes another, and none of
  # them duplicates the Trivy image scans further down.
  #
  # NOTE for branch protection: these are NOT wired into the `rust` aggregator's
  # `needs`. That job is the Rust union-completeness gate and adding unrelated jobs
  # would blur what a red `rust` means. Require `secret-scan` and `sast` as their own
  # checks — both names are stable and neither is a matrix job.

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # HISTORY, not the working tree. Secret scanning earns its keep in exactly the
          # case where a credential was committed and then deleted: the default shallow
          # clone (fetch-depth 1) sees only the deletion, reports clean, and misses the
          # single thing this job exists to catch. Scoped to THIS job — the Rust shards
          # gain nothing from a full clone and it is not free.
          fetch-depth: 0
      # BLOCKS. This repository is PUBLIC, so a credential that reaches a branch here is
      # already disclosed the moment it is pushed; "reported, merged anyway, rotate
      # later" is not a coherent outcome for it. This is the one scanner in this file
      # where a warning would be strictly worse than nothing, because it would create a
      # record that everyone had been told and nobody had to act.
      #
      # Installed as a released binary rather than through `gitleaks/gitleaks-action`,
      # following the kubeconform precedent below: it removes a wrapper action from the
      # pinning surface, and gitleaks-action additionally demands a GITLEAKS_LICENSE for
      # organization accounts, which is a licence check standing in front of a security
      # gate.
      #
      # `--redact` is NOT cosmetic. Workflow logs on a public repository are public, so
      # printing the matched value on failure would widen the very disclosure the job
      # detected. The redacted fingerprint plus the file and line is enough to triage.
      - name: Scan the full git history for secrets
        run: |
          set -euo pipefail
          version=8.30.1
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          # `git` (not `dir`) is the history-walking subcommand; `dir` would scan the
          # checked-out tree and reintroduce the blind spot fetch-depth: 0 just paid for.
          # `.gitleaksignore` at the repo root is picked up automatically and holds the
          # triaged baseline — 13 test fixtures, each read and justified in that file.
          "$RUNNER_TEMP/bin/gitleaks" git . \
            --redact \
            --no-banner \
            --no-color \
            --exit-code 1 \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"
      - name: Upload gitleaks report
        # `failure()`: the report is only interesting when something was found, and it is
        # redacted, so it is safe to keep as an artifact for triage.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
          if-no-files-found: ignore

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Semgrep rather than CodeQL, for one reason: `github/codeql-action/analyze` does
      # not fail a run on findings — it writes them to the Security tab and exits 0.
      # That is a dashboard, not a gate, and this file already has a standing rule
      # against guards that cannot go red. Semgrep exits non-zero under `--error`.
      #
      # `pipx` is preinstalled on the ubuntu-24.04 runner image (1.16.0) and installs
      # into its own virtualenv, so this does not fight Ubuntu's PEP 668
      # externally-managed Python the way `pip install --user` would.
      - name: Install semgrep
        run: pipx install semgrep==1.172.0
      # BLOCKS, and covers EVERY p/rust rule at EVERY severity — not just ERROR.
      #
      # The reason this is its own step, rather than another `--config=p/rust` folded into
      # the step below, is that `--severity=ERROR` filters p/rust down to NOTHING. Measured
      # on this tree with semgrep 1.172.0: the ERROR-severity run over all five rulesets
      # reports `ts 24 / yaml 7 / dockerfile 4 / js 22` rules and has no `rust` row at all,
      # 34 rules over 119 targets. p/rust's 11 rules are all WARNING or INFO. A
      # `--config=p/rust` sitting next to `--severity=ERROR` is inert, and a Rust
      # repository whose blocking SAST step reads no Rust is exactly the toothless shape
      # this file keeps cataloguing.
      #
      # So Rust is gated on its own terms: all 11 rules, no severity filter. The triaged
      # baseline that makes this green is two `nosemgrep: rust.lang.security.args.args`
      # comments in src/main.rs, each with the reasoning written next to the code. That is
      # the whole residue — 11 rules over 94 Rust files produced 2 findings, both argv
      # parsing in the operator CLI. There is no `.semgrepignore`, because suppressing by
      # path would hide future findings in the same files.
      - name: Semgrep — blocking gate for Rust (all p/rust rules, every severity)
        run: |
          semgrep scan --error --metrics=off \
            --config=p/rust
      # BLOCKS, at ERROR severity, for everything that is not Rust. ERROR in the registry
      # rulesets means "this is a bug with a security consequence", which is the band worth
      # stopping a merge for. `--metrics=off` because a security job should not phone home
      # about the code it just read.
      #
      # p/rust is deliberately absent: it contributes zero rules at this severity, and
      # listing it here would advertise Rust coverage that the step does not have. Rust is
      # gated by the step above.
      - name: Semgrep — blocking gate (ERROR severity, non-Rust rulesets)
        run: |
          semgrep scan --error --metrics=off --severity=ERROR \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/github-actions \
            --config=p/dockerfile
      # REPORTS ONLY, deliberately, and this is the honest version of that choice: there
      # is no triaged WARNING/INFO baseline for these four rulesets yet, and turning
      # unreviewed style-adjacent findings into a merge blocker on the day they first run
      # teaches everyone to bypass the check. Measured on this tree: 33 findings, of which
      # 31 are `github-actions-mutable-action-tag` against this very file. Note there is no
      # `--error` and no `continue-on-error:` here — findings exit 0, but a semgrep CRASH
      # still exits 2 and reds the job, because "the scanner did not run" must never read
      # as "the scanner found nothing".
      #
      # p/rust is absent here too: it is fully blocking above, so repeating it would only
      # print findings that already failed the run.
      #
      # TO PROMOTE: triage this step's output — pinning the action refs to commit SHAs
      # clears 31 of the 33 — then move `--severity=WARNING` up into the step above.
      - name: Semgrep — reporting only (WARNING and INFO, non-Rust rulesets)
        run: |
          semgrep scan --metrics=off --severity=WARNING --severity=INFO \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/github-actions \
            --config=p/dockerfile

  container-and-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      # `engineerd/setup-kind@v0.6.2` was here and was removed rather than repinned. It failed with
      # `File not found: .../v0.6.2/dist/main/index.js` — the tag exists but ships no built action —
      # and, more to the point, **nothing in this job ever used the cluster it created**. Every
      # remaining step is offline: `docker build` needs no Kubernetes, and `helm lint`,
      # `helm template` and `kubeconform` are all static validation. It was spending minutes
      # standing up a cluster for nobody.
      #
      # If a deploy smoke test is wanted later, add it deliberately along with the steps that
      # exercise it, rather than restoring a cluster that no step consumes.
      - run: docker build -t moira:ci .
      # SBOM of the IMAGE, not of the source tree, and therefore necessarily HERE: this
      # job is the only place the image exists, and a source-tree SBOM would omit the
      # base layer and every OS package — which is most of what the Trivy step below is
      # finding. Generating it in a separate job would mean building the image twice.
      #
      # Placed BEFORE Trivy on purpose. Trivy exits 1 on CRITICAL/HIGH, and if the SBOM
      # came after it, the run that most needs a dependency inventory would be exactly
      # the run that never produced one.
      #
      # REPORTS ONLY, and that is not a weak choice: an SBOM is an inventory and has no
      # pass/fail semantics to weaken. The gate that turns this inventory into a red
      # build is the Trivy step immediately below. A non-zero exit here means syft
      # itself failed, and that already fails the job.
      - name: Generate CycloneDX SBOM for the Moira image
        uses: anchore/sbom-action@v0.24.0
        with:
          image: moira:ci
          format: cyclonedx-json
          artifact-name: moira-image-sbom.cyclonedx.json
          output-file: moira-image-sbom.cyclonedx.json
          upload-artifact: true
          # This workflow has no `release` trigger, so this would never fire; set
          # explicitly rather than relying on that staying true.
          upload-release-assets: false
      # `0.28.0` did not resolve: this action's tags are v-prefixed (`v0.36.0`, `v0.35.0`, …),
      # so the unprefixed ref matched nothing and the job died before running a single step.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moira:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - run: helm lint charts/moira
      - run: helm template moira charts/moira > /tmp/moira-rendered.yaml
      # `yannh/kubeconform-action` does not exist — the GitHub API returns 404 for that
      # repository. Only `yannh/kubeconform`, the tool itself, is real. Installing the released
      # binary directly removes the dependency on a wrapper action that was never published.
      - name: Validate rendered manifests with kubeconform
        run: |
          set -euo pipefail
          version=v0.6.7
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          "$RUNNER_TEMP/bin/kubeconform" -ignore-missing-schemas -summary /tmp/moira-rendered.yaml
      # Issue #98 acceptance criterion (5). The step above validates NOTHING about the
      # ServiceMonitor, twice over: `serviceMonitor.enabled` defaults to false so the
      # template never renders, and `-ignore-missing-schemas` would wave the CRD through
      # unvalidated even if it did. A rule that skips the only object it was named for is
      # the toothless shape this file keeps cataloguing.
      #
      # So: render it explicitly, and validate it against the real CRD schema with
      # `-ignore-missing-schemas` REMOVED. If the schema cannot be fetched, this step
      # fails rather than passing silently — an unreachable schema and a valid manifest
      # must not produce the same green tick.
      #
      # The `grep -q` is the guard on the guard. Without it, renaming or removing the
      # `serviceMonitor.enabled` value would make `helm template` emit nothing, and
      # kubeconform validates an empty document happily.
      - name: Render and validate the ServiceMonitor against its CRD schema
        run: |
          set -euo pipefail
          helm template moira charts/moira \
            --set serviceMonitor.enabled=true \
            > /tmp/moira-rendered-servicemonitor.yaml
          grep -q '^kind: ServiceMonitor$' /tmp/moira-rendered-servicemonitor.yaml
          "$RUNNER_TEMP/bin/kubeconform" -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/moira-rendered-servicemonitor.yaml

  # Frontend gate for the Next.js admin console. Everything here is scoped to
  # `console/` and shares nothing with the Rust jobs, so it runs in parallel with
  # them rather than behind them.
  console:
    runs-on: ubuntu-latest
    # Playwright can hang rather than fail; a job-level cap turns that into a red
    # run instead of a runner held for six hours.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: console
    # The console owns its own database (`console_auth`) — Better Auth's session,
    # account and jwks tables plus the provider-secret store. It is deliberately
    # separate from Moira's: different lifecycle, different secrets, and the console
    # is the internet-facing half.
    #
    # Plain `postgres` rather than the `pgvector` image the `rust` job uses; the
    # console stores no embeddings and pulling a larger image would buy nothing.
    #
    # Without this service the console's database suites fail **loudly** with
    # "cannot reach PostgreSQL … Set CONSOLE_SKIP_DB_TESTS=1 to disable deliberately"
    # — by design. That flag reds a separate availability test on purpose, so a CI
    # run cannot quietly skip the durability guarantees this job exists to prove.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: console_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONSOLE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/console_auth_test
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in `console/package.json`'s `packageManager`
      # field and in `console/Dockerfile`'s BUN_VERSION. Three places, one
      # number: a bump that misses one of them produces a CI run that does not
      # match the image it is gating.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Playwright IS run here. The suite qualifies for an unattended gate: the
      # config's own header states it talks to no Moira instance and no auth
      # provider, its `webServer` builds and starts the standalone server the
      # image ships, and it already sets `retries: 2` and `workers: 1` under CI.
      # The specs it runs — smoke, axe a11y, and the secret-leak tap — are
      # exactly the checks that are worthless if they only ever run on a laptop.
      #
      # Browser install is its own step on purpose: an apt/CDN failure inside
      # `playwright install` and a genuine test failure are different incidents,
      # and folding them into one step makes the log the only way to tell them
      # apart.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      # NO `E2E_SKIP_BUILD`. It used to be set here, to reuse the `bun run build`
      # output from the step above — and that made the secret-leak gate's
      # BUILD-OUTPUT scan vacuous on every CI run.
      #
      # The build step above runs under this job's `env:`, which contains only
      # `CONSOLE_TEST_DATABASE_URL`. The e2e sentinels live in
      # `console/e2e/support/secrets.ts` and reach the server through
      # `webServer.env`, so a `.next` produced by that step never contained them.
      # A scan for a value that was never in the build's environment finds
      # nothing and reports success.
      #
      # REPRODUCED before removing it (plan 09 wave 3): a statically prerendered
      # `/` rendering `{process.env.MOIRA_E2E_SENTINEL_SYSTEM_KEY}`, built from a
      # sentinel-free shell and run with `E2E_SKIP_BUILD=1`, gave 13 passed /
      # exit 0. `console/e2e/secret-leak.e2e.ts:96-102` had recorded this hazard
      # in prose and stated the flag "must not be used for a gating run"; this
      # workflow was using it for exactly that.
      #
      # `playwright.config.ts` now refuses the flag under CI outright, so
      # re-adding this line fails loudly instead of quietly going green. The cost
      # is one extra Next build (~3s on this project).
      - name: Playwright e2e
        run: bun run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: console/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # A separate job from `container-and-helm`, not extra steps inside it.
  #
  # The two share no inputs: that job builds the Rust image from the repo root
  # Dockerfile and validates `charts/moira`; this one builds the console image
  # from `console/` and validates `charts/moira-console`. Appending these steps
  # there would serialise two independent multi-minute image builds behind one
  # another and collapse two unrelated failure causes into a single red check —
  # "container-and-helm failed" would no longer say which half broke. Two jobs
  # run concurrently and name their own failure. The only duplication is the
  # kubeconform download, which is a two-second curl.
  console-container-and-helm:
    runs-on: ubuntu-latest
    permissions:
      # Deliberately narrower than `container-and-helm`'s. Trivy runs with
      # `format: table` and uploads no SARIF, so `security-events: write` would
      # be an unused write scope on a job that builds an internet-facing image.
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      # Build context is `console/`, matching the COPY paths in its Dockerfile.
      - run: docker build -t moira-console:ci console
      # Same reasoning as the Moira image's SBOM: before the scanner, inventory only,
      # generated where the image exists. The console is the internet-facing half, so
      # if anything it is the image whose contents most need to be enumerable after the
      # fact.
      - name: Generate CycloneDX SBOM for the console image
        uses: anchore/sbom-action@v0.24.0
        with:
          image: moira-console:ci
          format: cyclonedx-json
          artifact-name: moira-console-image-sbom.cyclonedx.json
          output-file: moira-console-image-sbom.cyclonedx.json
          upload-artifact: true
          upload-release-assets: false
      # Same action version, same exit-code and same severity floor as the Moira
      # image. No `--ignore-unfixed` and no `.trivyignore`: the console is the
      # internet-facing half, so it is the last place to start accepting a
      # CRITICAL because no patch has shipped yet.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moira-console:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - run: helm lint charts/moira-console
      - run: helm template moira-console charts/moira-console > /tmp/moira-console-rendered.yaml
      # Default values leave ingress, HPA, the created Secret and the migration
      # job unrendered, so a syntax error in any of those four templates would
      # ship green. This second render turns them all on — and doubles as a test
      # of the chart's own `fail` guards, since an invalid combination here stops
      # the job.
      - name: Render every optional template
        run: |
          set -euo pipefail
          helm template moira-console charts/moira-console \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set secret.create=true \
            --set secret.data.BETTER_AUTH_SECRET=ci-placeholder-not-a-real-secret \
            --set networkPolicy.moira.namespace=moira-system \
            --set migrationJob.enabled=true \
            --set migrationJob.image.repository=ghcr.io/example/moira-console-migrate \
            --set 'migrationJob.command={node,node_modules/@better-auth/cli/dist/index.js,migrate,--yes}' \
            > /tmp/moira-console-rendered-all.yaml
      - name: Validate rendered manifests with kubeconform
        run: |
          set -euo pipefail
          version=v0.6.7
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          "$RUNNER_TEMP/bin/kubeconform" -ignore-missing-schemas -summary \
            /tmp/moira-console-rendered.yaml \
            /tmp/moira-console-rendered-all.yaml
